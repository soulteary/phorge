; 内存与执行时间限制
; 由 Dockerfile COPY 到 /usr/local/etc/php/conf.d/phorge-memory.ini

; PHP 默认 128M 不足以支撑 Phorge 的部分请求（大 diff 渲染、导出、
; storage upgrade 等），PhabricatorStorageSetupCheck 也会按上传大小核对该值。
memory_limit=512M

; CLI 侧的 phd 守护进程与 storage 迁移属于长任务，不设墙钟上限。
max_execution_time=0

; 默认时区。Phorge 自身的显示时区由 phabricator.timezone 配置项决定，
; 这里只是给 PHP 一个确定值，避免 date() 相关的警告。
date.timezone=UTC
