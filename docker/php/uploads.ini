; 上传相关限制
; 由 Dockerfile COPY 到 /usr/local/etc/php/conf.d/phorge-uploads.ini

; PHP 默认 8M。Phorge 的 PhabricatorStorageSetupCheck 要求该值不小于 32M，
; 否则 Web 界面会报 "PHP post_max_size Not Configured" 的 setup issue。
post_max_size=32M

; Phorge 大文件走分块上传，不受 upload_max_filesize 限制；
; 若需要放宽单次表单上传，同步调大下面这项（不要超过 post_max_size）。
; upload_max_filesize=32M
