; OPcache（生产配置）
; 由 Dockerfile COPY 到 /usr/local/etc/php/conf.d/phorge-opcache.ini

opcache.enable=1

; 关闭时间戳校验：不再每次请求 stat 源文件，是 Phorge 生产环境的推荐设置。
; 代价是修改源码后必须重启容器（或 Apache）才会生效。
;
; 注意：opcache 对单个超大 PHP 文件的编译可能失败，典型症状是运行时报
; "Failed to load symbol XXX" / 类未定义。上游的中文等大体积翻译文件
; （src/infrastructure/internationalization/translation/ 下约两万行的
; PhabricatorChineseTranslation.php）就属于这一类。遇到时用 blacklist
; 把这些文件排除出 opcache：
;
;   opcache.blacklist_filename=/usr/local/etc/php/opcache-blacklist.txt
;
; 本 fork 的 translation/ 目录下当前只有英文系列翻译文件（US / British /
; Pirate / VeryWow），体积都不大，因此暂不需要 blacklist。
opcache.validate_timestamps=0

; 按需调优（默认值对单实例部署够用）
; opcache.memory_consumption=256
; opcache.max_accelerated_files=20000
; opcache.interned_strings_buffer=16
