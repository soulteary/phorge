<VirtualHost *:80>
    # Phorge 的 Web 根目录是 webroot/
    DocumentRoot /opt/phorge/phorge/webroot

    RewriteEngine on
    # 所有请求（含 /rsrc/ 静态资源）都交给 index.php：这是上游推荐的写法，
    # 静态资源由 Celerity 统一加哈希和缓存头，见
    # src/docs/user/configuration/configuration_guide.diviner。
    # UnsafeAllow3F 允许路径中出现已编码的 "?"（%3F），缺了它这类 URL 会 500。
    RewriteRule ^(.*)$ /index.php?__path__=$1 [B,L,QSA,UnsafeAllow3F]

    <Directory "/opt/phorge/phorge/webroot">
        Require all granted
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
