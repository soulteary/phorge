<VirtualHost *:80>
    # Phorge 的 Web 根目录是 webroot/
    DocumentRoot /opt/phorge/phorge/webroot

    RewriteEngine on
    # 所有请求（含 /rsrc/ 静态资源）都交给 index.php：这是上游推荐的写法，
    # 静态资源由 Celerity 统一加哈希和缓存头，见
    # src/docs/user/configuration/configuration_guide.diviner。
    # UnsafeAllow3F 允许路径中出现已编码的 "?"（%3F），缺了它这类 URL 会 500。
    RewriteRule ^(.*)$ /index.php?__path__=$1 [B,L,QSA,UnsafeAllow3F]

    # --- Traefik Forward Auth 头清洗（防伪造）---
    # PhabricatorTraefikAuthProvider 信任 X-Auth-User/Email/Name 这几个头来完成
    # 登录/注册，这些头本应只由前置的 Traefik ForwardAuth 中间件注入。若后端能被
    # 客户端直接访问，攻击者可自行伪造这些头冒充任意用户。这里默认无条件清除来自
    # 请求方的同名头（RequestHeader unset 早于反代注入之前的客户端值），Traefik 会
    # 在转发时重新注入可信的头，因此不冲突。
    # 需要 mod_headers（见 Dockerfile 的 a2enmod headers）。
    # 安全前提仍是：务必保证后端只能经由 Traefik 到达（见 DOCKER.md）。
    RequestHeader unset X-Auth-User
    RequestHeader unset X-Auth-Email
    RequestHeader unset X-Auth-Name

    <Directory "/opt/phorge/phorge/webroot">
        Require all granted
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
