<VirtualHost *:80>
    # Phorge 的 Web 根目录是 webroot/
    DocumentRoot /opt/phorge/phorge/webroot

    RewriteEngine on
    # 已存在的静态资源直接返回，否则交给 index.php（Phorge 路由）
    RewriteRule ^(.*)$ /index.php?__path__=$1 [B,L,QSA]

    <Directory "/opt/phorge/phorge/webroot">
        Require all granted
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
