# Build Gorge from the adjacent checkout; preserve the default runtime configuration.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Optional services retain their mailer/search/maintenance/gitea profiles.
services:
  gorge-render:
    image: gorge-render:local
    build:
      context: ../gorge/go
      dockerfile: Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOROOT_BOOTSTRAP: ${GOROOT_BOOTSTRAP:-/usr/local/go}
        SERVICE: gorge-render
        PORT: 8140
  gorge-conduit:
    image: gorge-conduit:local
