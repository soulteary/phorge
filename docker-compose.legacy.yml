# Phorge (phorge-fork) 旧版单容器编排
# 用法:
#   cp .env.example .env          # 可选，用于改密码 / 端口 / 域名
#   docker compose -f docker-compose.legacy.yml up -d --build --remove-orphans
#   然后浏览器访问 http://127.0.0.1:8088/ 完成初始管理员注册。
#
# 说明:
#   - Phorge 官方无 Docker 镜像，phorge 服务基于本目录 Dockerfile 自建。
#   - MySQL 使用 Phorge 要求的若干参数 (sql_mode / max_allowed_packet 等)。
#   - db-init 是一次性任务，为 Phorge 的普通库用户补齐命名空间多库的授权。
#   - 所有可调项都有内置默认值，不写 .env 也能直接跑。

services:
  mysql:
    image: mysql:${MYSQL_IMAGE_TAG:-8.0.46}
    container_name: phorge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-phorge_root}
      # 下面三项让镜像在首次初始化时建出 Phorge 使用的普通账号。
      # 真正的多库授权由 db-init 完成，见 docker/db-grant.sql。
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phorge}
      MYSQL_USER: ${MYSQL_USER:-phorge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-phorge}
    command:
      - --sql-mode=STRICT_ALL_TABLES
      - --max-allowed-packet=134217728          # 128M，Phorge 要求 >= 32M
      - --innodb-buffer-pool-size=1600M
      - --local-infile=0
      - --ft-min-word-len=3
    volumes:
      - phorge-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-phorge_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 默认不把 3306 暴露到宿主。需要用客户端直连时，创建
    # docker-compose.override.yml 加上:
    #   services:
    #     mysql:
    #       ports:
    #         - "127.0.0.1:3306:3306"

  # 一次性任务：给普通库用户授予 `phabricator_%` 整组库的权限。
  # phorge 服务用 service_completed_successfully 等它跑完，避免首启动时
  # storage upgrade 因缺权限报 1044。重复执行是幂等的。
  #
  # 注意: GRANT 要求账号已存在。全新数据卷由 mysql 镜像的 MYSQL_USER 建出；
  # 若沿用旧的、只有 root 的数据卷，请先手工 CREATE USER 再启动。
  db-init:
    image: mysql:${MYSQL_IMAGE_TAG:-8.0.46}
    container_name: phorge-db-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-phorge_root}
      PHORGE_DB_USER: ${MYSQL_USER:-phorge}
      PHORGE_DB_NAMESPACE: ${PHORGE_DB_NAMESPACE:-phabricator}
    volumes:
      - ./docker/db-grant.sql:/db-grant.sql:ro
    command:
      - sh
      - -c
      - |
        set -e
        case "$$PHORGE_DB_NAMESPACE" in
          ''|*[!a-zA-Z0-9_$$]*)
            echo "[db-init] 非法数据库命名空间: $$PHORGE_DB_NAMESPACE" >&2
            exit 64
            ;;
        esac
        if [ "$${#PHORGE_DB_NAMESPACE}" -ge 45 ]; then
          echo "[db-init] 数据库命名空间必须少于 45 个字符。" >&2
          exit 64
        fi
        sed \
          -e "s/__PHORGE_USER__/$$PHORGE_DB_USER/g" \
          -e "s/__PHORGE_NAMESPACE__/$$PHORGE_DB_NAMESPACE/g" \
          /db-grant.sql |
          mysql -h mysql -P 3306 -u root -p"$$MYSQL_ROOT_PASSWORD"
        echo "[db-init] 已为 $$PHORGE_DB_USER 授权 $${PHORGE_DB_NAMESPACE}_% 库。"

  phorge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phorge-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-phorge}
      MYSQL_PASS: ${MYSQL_PASSWORD:-phorge}
      PHORGE_DB_NAMESPACE: ${PHORGE_DB_NAMESPACE:-phabricator}
      # 注意: Phorge 要求 base-uri 的域名必须含点号(.)，裸 "localhost" 会被拒绝。
      # 默认值与 PHORGE_HTTP_PORT 联动，否则改了端口站点会 redirect 到错误地址。
      # 正式部署请在 .env 里改成你的真实域名。
      PHORGE_BASE_URI: ${PHORGE_BASE_URI:-http://127.0.0.1:${PHORGE_HTTP_PORT:-8088}/}
      PHORGE_TIMEZONE: ${PHORGE_TIMEZONE:-UTC}
      PHORGE_WAIT_DB: ${PHORGE_WAIT_DB:-1}
      PHORGE_AUTO_UPGRADE: ${PHORGE_AUTO_UPGRADE:-1}
      PHORGE_START_PHD: ${PHORGE_START_PHD:-1}
      # full 保持上游全部应用；collaboration 让 Gitea 承担代码托管与评审。
      PHORGE_PRODUCT_PROFILE: ${PHORGE_PRODUCT_PROFILE:-full}
      GITEA_BASE_URI: ${GITEA_BASE_URI:-}
      # 从默认 Gorge 栈切回 legacy 时，清掉持久化的队列端点和
      # webhook 委派、受管 mailer/search 条目，并精确恢复进入 Gorge 前的
      # taskmaster 池大小。Gorge 叠加文件会显式把这些模式改回 enable。
      GORGE_MAILER_MODE: disable
      GORGE_MAILER_KEY: ${GORGE_MAILER_KEY:-gorge-mailer}
      GORGE_SEARCH_MODE: disable
      GORGE_WEBHOOK_MODE: disable
      GORGE_TASKQUEUE_MODE: disable
    ports:
      - "${PHORGE_HTTP_PORT:-8088}:80"
    volumes:
      # 持久化本地配置：让 Web 界面里改的配置和守卫式生成的 local.json
      # 跨容器重建存活，也让「挂载自己的 local.json」这个用法成立。
      - phorge-conf:/opt/phorge/phorge/conf/local
      # 持久化仓库存储 (repository.default-local-path 默认值)
      - phorge-repo:/var/repo
    # Phorge 的 /status/ 是免鉴权路由（PhabricatorStatusController），返回
    # "ALIVE"。用 php 的 http 流而不是 curl CLI，避免假设镜像里有 curl。
    #
    # 两个细节:
    #   - Host 头按 PHORGE_BASE_URI 改写。Phorge 用 Host 匹配站点
    #     (PhabricatorPlatformSite)，配了自定义域名后直接发
    #     "Host: 127.0.0.1" 会匹配不到站点而失败。
    #   - 这段 PHP 刻意不用任何变量，省掉 compose 里 $$ 转义带来的歧义。
    #     不带 ignore_errors 时 PHP 的 http 流对 4xx/5xx 直接返回 false，
    #     正好等价于「HTTP 状态正常」判断。
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          exit(@file_get_contents("http://127.0.0.1/status/", false,
          stream_context_create(array("http" => array("timeout" => 4,
          "header" => "Host: ".(parse_url(getenv("PHORGE_BASE_URI")
          ?: "http://127.0.0.1/", PHP_URL_HOST) ?: "127.0.0.1")))))
          === false ? 1 : 0);
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  phorge-db:
  phorge-conf:
  phorge-repo:
