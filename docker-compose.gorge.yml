# Phorge (phorge-fork) Gorge 服务定义
# ------------------------------------------------------------------
# 用法：默认栈已内置 Gorge 核心服务，直接一键启动即可：
#   docker compose up -d --build
#
# 本文件只是 gorge-* 服务定义的单一来源，默认 docker-compose.yml 用 extends
# 逐个引用它们。它**不是**可以用 -f 叠加的 override：
#   - 与默认文件叠加会重复定义同名服务；
#   - 单独启动不了，它不含 mysql / db-init / phorge。
#
# 自定义编排要接 Gorge，照默认 docker-compose.yml 的写法做，不要 -f 本文件：
#   1. 用 extends 从本文件引用需要的 gorge-* 服务；
#   2. 自己定义 phorge-migrate / phorge / phorge-daemon 三个角色，并把全部
#      GORGE_* 端点变量放在 **phorge-migrate** 上。
#      端点由 migrate 角色一次性写进 deployment.json，web 与 daemon 只读加载；
#      放在 phorge（web）上不会生效，而缺少 migrate 角色的编排根本起不来
#      （web/daemon 缺 local.json / deployment.json 时直接退出）。
#      docker-compose.yml 的 phorge-migrate 段就是这份变量契约的参考实现。
#
# 本文件曾经还带一个只补 depends_on 与 GORGE_* 的 phorge 片段，供旧的
# docker-compose.legacy.yml 叠加。那些变量只有 legacy 控制面会读，而该控制面
# 已经移除（PHORGE_CONTROL_PLANE=legacy 现在直接 exit 64），所以片段一并删掉，
# 以免它看起来还是一条可用的接入方式。
#
# 说明：
#   - 上面那条命令里的 --build 不能省。phorge 是 build 型服务、entrypoint.sh 是烤进
#     镜像的，本地已存在旧的 phorge 镜像时，不带 --build 的 up -d 会直接复用它，容器里
#     跑的就是**旧版 entrypoint**：notification.servers 与 cluster.mailers 整段不下发，
#     而且**不报任何错误**——没有告警、没有失败退出，Config 页面看着也正常。唯一的线索
#     是启动日志里少了那几行 `[entrypoint] 下发 Gorge ... 配置`。
#   - 本文件起一组可独立取舍的服务，用不上哪个就把对应的 service 段、以及 phorge
#     段里对应的 depends_on 与环境变量一起删掉：
#       gorge-render        基于 Chroma 的语法高亮服务，替换 Phorge 内置高亮器
#       gorge-conduit       统一鉴权、限流和审计的 Conduit 反向代理网关
#       gorge-notification  与 Aphlict 线兼容的实时通知服务，替换 Node.js 版 aphlict
#       gorge-mailer        统一 7 种后端的发信服务，作为 cluster.mailers 的一个条目
#       gorge-search        统一 ES / Meilisearch 的全文检索服务，作为 cluster.search
#                           的一个条目（type: gorge）
#       gorge-file-storage  统一 MySQL blob / 本地磁盘 / S3 的文件存储服务，作为一个
#                           PhabricatorFileStorageEngine（identifier: gorge）
#       gorge-webhook       接管 Herald webhook 投递的服务，替换 phd 里的
#                           HeraldWebhookWorker（它不被 phorge 调用，直接读写队列表）
#       gorge-taskqueue     接管 Phorge 任务队列的 HTTP 服务
#       gorge-worker        从 gorge-taskqueue 领取并执行任务的 worker
#       gorge-db-api        只读的 MySQL 集群、schema 与迁移状态诊断 API
#   - 消费端配置由 phorge 的 entrypoint.sh 幂等写进 conf/local/local.json
#     （gorge.render.uri / gorge.render.token、notification.servers、cluster.mailers、
#     cluster.search / gorge.search.token、gorge.file.uri / gorge.file.token、
#     gorge.webhook.uri / gorge.webhook.token、gorge.taskqueue.uri /
#     gorge.taskqueue.token、gorge.db.uri / gorge.db.token）。
#   - 高亮起来之后还有**一步手工切换**：Phorge 默认仍用内置高亮引擎，需要把
#     syntax-highlighter.engine 切到 PhabricatorGorgeSyntaxHighlighterEngine
#     并清一次缓存。命令与原因见 DOCKER.md「用 Gorge 做语法高亮」。
#     切换独立于编排，是为了让「服务在跑但先不接」和一条命令回滚都成立。
#     通知与发信**没有**这一步：notification.servers 与 cluster.mailers 一写进去就生效。
#     **文件存储也有这一步**，而且形式最阴：写了 gorge.file.uri 之后引擎就会自动被
#     发现，但 Phorge 原生的 blob 引擎 priority 更小、仍然先拿到每个文件，于是新文件
#     按大小散落在两套引擎里，**既不生效也不报错**。第二步是把原生引擎关掉，见
#     DOCKER.md「用 Gorge 做文件存储」。
#     **webhook 没有这一步，而且方向相反**：gorge.webhook.uri 一写进去，phorge 就立刻
#     停止调度 HeraldWebhookWorker，投递整个交给 gorge-webhook。要注意的不是「配了不
#     生效」，而是反过来的「服务在跑但配置没写进去 = 投递两次」，见下面 gorge-webhook
#     段与 DOCKER.md「用 Gorge 投递 Webhook」。
#   - 所有可调项都有内置默认值，不写 .env 也能直接跑。**发信与检索是两个例外**，
#     它们都需要你自己提供一个后端：
#       gorge-mailer 必须至少配一个投递后端（MAILER_TYPE + 对应的 SMTP_* / MAILER_*），
#         否则它的 /readyz 不通、每一封信都会失败。见 DOCKER.md「用 Gorge 发送邮件」。
#       gorge-search 必须至少配一个搜索后端（ES_HOST 或 MEILI_HOST，指向本编排之外
#         的实例），否则它的 /readyz 不通、每一次检索都会失败。另外它还有**一步手工
#         建索引**（bin/search init + index --all --force），见 DOCKER.md
#         「用 Gorge 做全文搜索」。
#     gorge-file-storage 不属于这两个例外：本文件默认给它挂了一个数据卷并启用本地磁盘
#     后端，所以开箱就有一个可写的后端，不用你配任何东西。
#     （但它的 /readyz 在**首次**启动时会有一段 503 的窗口，因为默认同时启用的 blob 后端
#     要等 phorge 建出 {namespace}_file 库。上传不受影响，会下沉到本地磁盘后端。
#     它和 gorge-webhook 因此都只被 phorge 用 service_started 依赖，见各自的注释。）
#   - gorge-file-storage 是唯一拥有自己数据卷的服务；它的 blob 后端与 gorge-webhook、
#     gorge-taskqueue 都会读写 Phorge 的表，gorge-db-api 则只读。四者都依赖 mysql 与
#     db-init。删 gorge-file-storage 段之前先确认没有文件已经落在它里面 —— 引擎标识是
#     按文件存在库里的，服务没了那些文件就读不出来。删 gorge-webhook 段则必须连同 phorge
#     段里的 GORGE_WEBHOOK_URI 一起删，否则 phorge 会一直以为投递已经交出去了，谁也不发。
# ------------------------------------------------------------------

services:
  # gorge-render 一个进程承载 render 与 diff 两个域（路由 /api/highlight/*、
  # /api/diff/*），容器内
  # 固定监听 8140。镜像由 gorge 仓库的 release 工作流推到统一的 ghcr package，版本标签
  # 与 latest 都有；生产建议在 .env 里把 GORGE_IMAGE_TAG 钉到具体版本，避免
  # docker compose pull 悄悄换掉高亮实现。
  gorge-render:
    image: ghcr.io/soulteary/gorge:render-${GORGE_RENDER_IMAGE_TAG:-${GORGE_IMAGE_TAG:-latest}}
    container_name: phorge-gorge-render
    restart: unless-stopped
    environment:
      # 监听地址固定 :8140。下面的健康检查与 phorge 的 GORGE_RENDER_URI 默认值
      # 都按它写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8140"
      # 服务间共享密钥，PHP 客户端以请求头 X-Service-Token 发送，两端必须同值，
      # 所以这里和 phorge 都取同一个 GORGE_RENDER_TOKEN。留空表示服务端不鉴权：
      # gorge-render 不对宿主暴露端口、只在 compose 内网可达，因此默认留空；
      # 若把它放到共享网络里，务必设一个值。
      GORGE_SERVICE_TOKEN: ${GORGE_RENDER_TOKEN:-}
      # 单次高亮接受的源码大小上限（字节），超限返回 413 ERR_TOO_LARGE，
      # Phorge 侧表现为该文件回退到无高亮。默认 1MiB。
      GORGE_RENDER_MAX_BYTES: ${GORGE_RENDER_MAX_BYTES:-1048576}
      # diff 域与 render 共用此进程，但有独立的输入上限。计算 old 与 new 的
      # 合计字节数，超限时 Phorge 直接报错 —— 原生 diff 已经移除，没有可回退的
      # 本地 difference engine 了。要处理更大的输入就调高这个值。
      GORGE_DIFF_MAX_BYTES: ${GORGE_DIFF_MAX_BYTES:-1048576}
      # 单次高亮的服务端超时（秒）。PHP 客户端自己也有超时，两者取小者生效。
      GORGE_RENDER_TIMEOUT_SEC: ${GORGE_RENDER_TIMEOUT_SEC:-15}
      # 刻意写死 true，不接受 .env 覆盖：原生 GNU/PHP diff 已经移除，PHP 侧只要
      # 配了 gorge.render.uri 就无条件调用 /api/diff/*。服务端一旦不注册这两条
      # 路由，raw 与 prose diff 会直接失败且无处回退，所以这不再是一个开关。
      # 旧 .env 里残留的 GORGE_RENDER_ENABLE_DIFF 会被忽略。
      GORGE_RENDER_ENABLE_DIFF: "true"
    # 刻意不声明 ports：render/diff 服务只被 phorge 通过 compose 默认网络的服务名
    # gorge-render 调用，不需要宿主入口——少一个对外面，也省掉与 gorge 自己那套
    # 编排（deploy/compose 里映射了 8140）抢宿主端口。
    # 需要在宿主上直连排障时，用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-render:
    #       ports:
    #         - "127.0.0.1:8140:8140"
    # 健康探针：/healthz 返回裸 {"status":"ok"}，不套 {data,error} 信封也不校验
    # token，正是给容器探针用的。用 wget 而不是 curl：镜像基于 alpine，busybox
    # 自带 wget，没有 curl。
    # 镜像里已内置了同样参数的 HEALTHCHECK，这里显式重复一遍，是为了让下面
    # phorge 的 service_healthy 依赖不取决于所拉到的镜像标签是否带探针。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8140/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-conduit 一个进程承载整个 conduit 域（路由 ANY /api/:method），容器内
  # 固定监听 8150。它是 Conduit API 的**反向代理网关**：对经过鉴权与限流的请求，
  # 反代到上游 phorge 容器的 /api/*。与 render 一样是无状态服务，镜像由 gorge
  # 仓库的 release 工作流推到 ghcr，语义化版本标签与 latest 都有；生产建议在 .env
  # 里把 GORGE_IMAGE_TAG 钉到具体版本，避免 docker compose pull 悄悄换掉网关实现。
  gorge-conduit:
    image: ghcr.io/soulteary/gorge:conduit-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-conduit
    restart: unless-stopped
    environment:
      # 监听地址固定 :8150。下面的健康检查与 phorge 的 GORGE_CONDUIT_URI 默认值
      # 都按它写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8150"
      # 服务间共享密钥，PHP 客户端以请求头 X-Service-Token 发送，两端必须同值，
      # 所以这里和 phorge 都取同一个 GORGE_CONDUIT_TOKEN。留空表示网关不鉴权：
      # gorge-conduit 不对宿主暴露端口、只在 compose 内网可达，因此默认留空；
      # 若把它放到共享网络里，务必设一个值。
      GORGE_SERVICE_TOKEN: ${GORGE_CONDUIT_TOKEN:-}
      # 反代的上游地址：指回本编排里的 phorge 容器（走 compose 默认网络的服务名）。
      # 结尾不带斜杠：网关按 {upstream}/api/{method} 拼接反代目标。
      GORGE_CONDUIT_UPSTREAM_URL: ${GORGE_CONDUIT_UPSTREAM_URL:-http://phorge:80}
      # 反代单次请求的服务端超时（秒）。
      GORGE_CONDUIT_PROXY_TIMEOUT_SEC: ${GORGE_CONDUIT_PROXY_TIMEOUT_SEC:-30}
      # 单次请求 body 的大小上限（字节），超限返回 413。默认 8MiB。
      GORGE_CONDUIT_MAX_BODY_SIZE: ${GORGE_CONDUIT_MAX_BODY_SIZE:-8388608}
      # IP 令牌桶限流：每 IP 每秒补充的令牌数与突发上限，超限返回 429。
      GORGE_CONDUIT_RATE_LIMIT_RPS: ${GORGE_CONDUIT_RATE_LIMIT_RPS:-20}
      GORGE_CONDUIT_RATE_LIMIT_BURST: ${GORGE_CONDUIT_RATE_LIMIT_BURST:-40}
    # 刻意不声明 ports：网关只被 phorge（以及其它同网络的 Go 服务）通过 compose
    # 默认网络的服务名 gorge-conduit 调用，不需要宿主入口——少一个对外面，也省掉与
    # gorge 自己那套编排（deploy/compose 里映射了 8150）抢宿主端口。
    # 需要在宿主上直连排障时，用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-conduit:
    #       ports:
    #         - "127.0.0.1:8150:8150"
    # 健康探针：/healthz 返回裸 {"status":"ok"}，不套信封也不校验 token，正是给
    # 容器探针用的。用 wget 而不是 curl：镜像基于 alpine，busybox 自带 wget。
    # 镜像里已内置了同样参数的 HEALTHCHECK，这里显式重复一遍，是为了让下面
    # phorge 的 service_healthy 依赖不取决于所拉到的镜像标签是否带探针。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8150/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-notification 一个进程同时监听两个端口。这不是实现偏好，是 PHP 侧的硬
  # 要求：PhabricatorNotificationServersConfigType 校验 notification.servers 时，
  # 必须同时存在一条启用的 type=admin 与一条启用的 type=client，且两条记录的
  # "{host}:{port}" 不得重复，缺任一类直接抛异常。
  #   client :22280  浏览器的 WebSocket 入口（页面里的 JX.Aphlict 连它）
  #   admin  :22281  PHP 侧投递消息与查状态（POST / 与 GET /status/）
  # 它与上游 Node.js 版 aphlict 完全线兼容（同样的路径、同样的报文、同样不鉴权），
  # 所以接入不需要改任何 PHP 代码，全部靠本文件的编排加 entrypoint.sh 的下发。
  gorge-notification:
    image: ghcr.io/soulteary/gorge:notification-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-notification
    restart: unless-stopped
    environment:
      # 容器内的监听地址与两个端口。这三项刻意写成字面量而不是 ${...}：它们与
      # 下面的 ports、healthcheck 是死绑的，改一处就得三处一起改，做成 .env 变量
      # 只会让人以为改一个地方就够。
      # 注意别和下面 phorge 段里同名的 GORGE_NOTIFICATION_* 混淆：那一组描述的是
      # 「PHP 与浏览器看到的地址」，这一组描述的是「容器内部监听哪儿」，两组的
      # 值在走反向代理时会完全不同。
      GORGE_NOTIFICATION_LISTEN_ADDR: 0.0.0.0
      GORGE_NOTIFICATION_CLIENT_PORT: "22280"
      GORGE_NOTIFICATION_ADMIN_PORT: "22281"
    ports:
      # 与 gorge-render 相反，client 端口**必须**映射到宿主：连它的是用户的浏览器
      # ——Phorge 把 PhabricatorNotificationServerRef::getWebsocketURI() 生成的
      # ws:// 地址原样发给 JS 客户端，而 compose 的内网服务名在浏览器里解析不了。
      # admin 端口则刻意不映射：只有同网络的 phorge 容器会访问它，而且为了与
      # aphlict 保持线兼容它**不做任何鉴权**，暴露到宿主等于允许任何人代发通知。
      #
      # 宿主一侧的端口刻意复用 GORGE_NOTIFICATION_CLIENT_PORT —— 就是写进配置、
      # 交给浏览器的那个端口。直连场景下两者本来就必须相等，共用一个变量就没有
      # 「改了一个忘了另一个」的余地；容器一侧则固定 22280，与上面的 environment
      # 对应。走反向代理时这条映射整个不需要，做法见 DOCKER.md。
      #
      # 绑定地址默认只绑回环，与 GORGE_NOTIFICATION_CLIENT_HOST 的默认值 127.0.0.1
      # 配套，够本机开发用。要让局域网或公网的浏览器也能连上，在 .env 里把
      # GORGE_NOTIFICATION_CLIENT_BIND 改成 0.0.0.0（或某张网卡的地址），并把
      # GORGE_NOTIFICATION_CLIENT_HOST 改成浏览器实际使用的主机名/IP —— 两者是一起
      # 改的，只改一个的表现是「Config 页面显示正常但页面收不到通知」。
      - "${GORGE_NOTIFICATION_CLIENT_BIND:-127.0.0.1}:${GORGE_NOTIFICATION_CLIENT_PORT:-22280}:22280"
    # 健康探针打 admin 口的 /healthz，返回裸 {"status":"ok"}。
    # 刻意**不**探 client 口的 GET /：那条路由按 Aphlict 的约定固定返回 501
    # （PhabricatorNotificationServerRef::testClient() 正是把 501 当作健康信号，
    # 拿到 200 反而报错），wget 会把 501 判成失败，容器会一直 unhealthy。
    # 同 gorge-render 用 busybox 的 wget：镜像基于 alpine，没有 curl。镜像里已内置
    # 同样参数的 HEALTHCHECK，这里显式重复一遍，是为了让下面 phorge 的
    # service_healthy 依赖不取决于所拉到的镜像标签是否带探针。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:22281/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-mailer 把 SMTP / Sendmail / SES / SendGrid / Mailgun / Postmark 收在一个
  # HTTP API 后面（路由 /api/mailer/*），容器内固定监听 8110。Phorge 侧它只是
  # cluster.mailers 里的一个条目（type: "gorge"），由 entrypoint.sh 合并写入。
  #
  # 与另外两个服务最大的不同：**它需要你自己配一个投递后端**。下面那组 MAILER_* /
  # SMTP_* 全部留空时服务照样起得来、/healthz 也照样 200（进程是活的），但 /readyz
  # 会报 503，每一封信都失败。所以 .env 里至少要设 MAILER_TYPE 和它对应的那几项。
  gorge-mailer:
    image: ghcr.io/soulteary/gorge:mailer-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-mailer
    restart: unless-stopped
    environment:
      # 监听地址固定 :8110。下面的健康检查与 phorge 的 GORGE_MAILER_URI 默认值都按
      # 它写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8110"
      # 服务间共享密钥，PHP 客户端以请求头 X-Service-Token 发送，两端必须同值，所以
      # 这里和 phorge 都取同一个 GORGE_MAILER_TOKEN。留空表示服务端不鉴权：
      # gorge-mailer 不对宿主暴露端口、只在 compose 内网可达，因此默认留空。
      # 但它比另外两个服务更值得设一个值——能往这个口投请求就等于能以你的域名对外
      # 发信，一旦把它接进共享网络，务必设。
      GORGE_SERVICE_TOKEN: ${GORGE_MAILER_TOKEN:-}
      # 单封邮件正文（纯文本与 HTML 各自）的长度上限，超出部分按 UTF-8 边界截断，
      # 不报错。它**不是**整个请求体的上限：那一项固定 10M、不可调，附件走的是它。
      GORGE_MAILER_BODY_LIMIT: ${GORGE_MAILER_BODY_LIMIT:-524288}
      # 单个后端内部的重试次数与每次之间的等待秒数（失败到下一个后端之前先自己重试
      # 这么多次；判定为永久失败时立即短路，既不重试也不换后端）。
      # 默认值小得刻意：真正权威的重试循环是 Phorge 的 phd worker 队列，凡不是永久
      # 失败它都会重新投递，这里只用来吸收秒级抖动。整个循环还受请求上下文约束，而
      # 上面 phorge 段的 GORGE_MAILER_TIMEOUT 默认只等 30 秒——把这两个值调大，结果
      # 是客户端先超时放弃、服务端还在重试，白占一个 worker。
      GORGE_MAILER_MAX_RETRIES: ${GORGE_MAILER_MAX_RETRIES:-2}
      GORGE_MAILER_RETRY_WAIT: ${GORGE_MAILER_RETRY_WAIT:-2}

      # --- 投递后端（二选一的配置方式）---
      # 方式一：GORGE_MAILER_CONFIG 直接给一段 JSON 列表，可以一次配多个后端，服务端
      # 按 priority 排序并在失败时依次回退。配了它，下面那组单后端变量就整体不生效。
      # 例（写在 .env 里要用单行）：
      #   GORGE_MAILER_CONFIG=[{"key":"primary","type":"smtp","priority":100,
      #     "options":{"host":"smtp.example.com","port":"587","protocol":"tls",
      #     "user":"...","password":"..."}}]
      GORGE_MAILER_CONFIG: ${GORGE_MAILER_CONFIG:-}
      # 方式二（够用且好读）：MAILER_TYPE 选一种后端，再填它需要的那几项。
      # 取值：smtp / sendmail / ses / sendgrid / mailgun / postmark / test。
      # 留空表示一个后端都没配，服务会起来但 /readyz 报 503。
      # test 后端只把邮件丢掉，用来验证链路通不通，别用在生产上。
      MAILER_TYPE: ${MAILER_TYPE:-}
      # 这个 key 是**服务端**给后端起的名字，与 Phorge 侧 cluster.mailers 条目的 key
      # （GORGE_MAILER_KEY，默认 gorge-mailer）是两回事，不必也不该保持一致。
      # PHP 客户端不指定 mailerKeys，所以这个名字只在服务端日志和 /api/mailer/mailers
      # 的返回里出现。
      MAILER_KEY: ${MAILER_KEY:-}
      # smtp / sendmail 用
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-}
      # ses 用
      MAILER_ACCESS_KEY: ${MAILER_ACCESS_KEY:-}
      MAILER_SECRET_KEY: ${MAILER_SECRET_KEY:-}
      MAILER_REGION: ${MAILER_REGION:-}
      MAILER_ENDPOINT: ${MAILER_ENDPOINT:-}
      # sendgrid / mailgun 用
      MAILER_API_KEY: ${MAILER_API_KEY:-}
      MAILER_DOMAIN: ${MAILER_DOMAIN:-}
      MAILER_API_HOSTNAME: ${MAILER_API_HOSTNAME:-}
      # postmark 用
      MAILER_ACCESS_TOKEN: ${MAILER_ACCESS_TOKEN:-}
    # 与 gorge-render 同理刻意不声明 ports：只有 phorge 通过 compose 默认网络的服务名
    # gorge-mailer 调用它。这里比高亮更要紧——它不鉴权时是一个开放的转发器。
    # 需要在宿主上直连排障时，用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-mailer:
    #       ports:
    #         - "127.0.0.1:8110:8110"
    # 健康探针刻意打 /healthz（进程存活）而不是 /readyz（至少配了一个后端）：下面
    # phorge 的 depends_on 用的是 service_healthy，若这里探 /readyz，一个还没配后端
    # 的 gorge-mailer 会把整个站点堵在启动阶段——发不出邮件不该等同于站点起不来。
    # 「服务活着但一个后端都没配」这个状态由 PhabricatorGorgeMailerSetupCheck 在
    # Config 页面报出来，那里才是它该出现的地方。
    # 同样用 busybox 的 wget：镜像基于 alpine，没有 curl。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8110/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-search 把 Elasticsearch 与 Meilisearch 收在一个 HTTP API（路由
  # /api/search/*）后面，容器内固定监听 8120。Phorge 侧它是 cluster.search 里的一个
  # type: "gorge" 条目，由 entrypoint.sh 合并写入，走的是原生的
  # PhabricatorFulltextStorageEngine 扩展点（PhabricatorGorgeFulltextStorageEngine）。
  #
  # 与 gorge-mailer 一样、和另外两个服务不同：**它需要你自己提供一个搜索后端**。
  # 下面的 ES_* / MEILI_* 全部留空时服务照样起得来、/healthz 也照样 200，但 /readyz
  # 报 503，每一次检索都失败。
  #
  # 后端实例本身刻意**不**放进这个编排：Elasticsearch 的内存与磁盘参数、数据卷、版本
  # 升级都该由你按自己的规模来定，塞一个默认配置进来只会给人一个不该用在生产上的默认
  # 值。把 ES_HOST 指向你自己的实例即可；同一台 Docker 宿主上跑的实例可以用
  # host.docker.internal 或把它接进同一个网络。
  gorge-search:
    image: ghcr.io/soulteary/gorge:search-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-search
    restart: unless-stopped
    environment:
      # 监听地址固定 :8120。下面的健康检查与 phorge 的 GORGE_SEARCH_PORT 默认值都按
      # 它写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8120"
      # 服务间共享密钥，PHP 客户端以请求头 X-Service-Token 发送，两端必须同值，所以
      # 这里和 phorge 都取同一个 GORGE_SEARCH_TOKEN。留空表示服务端不鉴权：
      # gorge-search 不对宿主暴露端口、只在 compose 内网可达，因此默认留空。
      GORGE_SERVICE_TOKEN: ${GORGE_SEARCH_TOKEN:-}

      # --- 搜索后端（二选一的配置方式）---
      # 方式一：GORGE_SEARCH_BACKENDS 直接给一段 JSON 列表，可以一次配多个后端，服务端
      # 按角色分派并在失败时依次回退。配了它，下面那组单后端变量就整体不生效。
      # 例（写在 .env 里要用单行）：
      #   GORGE_SEARCH_BACKENDS=[{"type":"elasticsearch","hosts":["es-1:9200","es-2:9200"],
      #     "index":"phabricator","version":7,"roles":["read","write"]}]
      GORGE_SEARCH_BACKENDS: ${GORGE_SEARCH_BACKENDS:-}
      # 方式二（够用且好读）：选一种引擎，再填它需要的那几项。
      # 取值 elasticsearch（留空同义）或 meilisearch。
      GORGE_SEARCH_ENGINE: ${GORGE_SEARCH_ENGINE:-}
      # elasticsearch 用。ES_HOST 可以是逗号分隔的多台，服务端自己维护主机健康表。
      # 留空表示一个后端都没配，服务会起来但 /readyz 报 503。
      ES_HOST: ${ES_HOST:-}
      ES_PROTOCOL: ${ES_PROTOCOL:-}
      # 索引名。默认 phabricator，与 Phorge 的 Elasticsearch 引擎保持一致，所以从
      # 那个引擎切过来可以复用同一个索引（但 mapping 变了，仍要重建，见 DOCKER.md）。
      ES_INDEX: ${ES_INDEX:-}
      # 主版本号，决定 mapping 用哪一套写法。留空取服务端默认值 5。
      # **必须与集群的真实主版本一致**：ES 5 及更早每个文档类型一份 mapping，ES 6 一个
      # 索引只允许一个类型，ES 7 起类型被移除、改为文档上的 docType 字段。对着 ES 7
      # 集群填 5，mapping 会被 mapper_parsing_exception 直接拒掉，索引根本建不出来。
      ES_VERSION: ${ES_VERSION:-}
      ES_TIMEOUT: ${ES_TIMEOUT:-}
      # meilisearch 用
      MEILI_HOST: ${MEILI_HOST:-}
      MEILI_PROTOCOL: ${MEILI_PROTOCOL:-}
      MEILI_INDEX: ${MEILI_INDEX:-}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_TIMEOUT: ${MEILI_TIMEOUT:-}
    # 与 gorge-render / gorge-mailer 同理刻意不声明 ports：只有 phorge 通过 compose
    # 默认网络的服务名 gorge-search 调用它，不需要宿主入口。而且不鉴权时它是一个能读
    # 写整个索引的开放接口。
    # 需要在宿主上直连排障时，用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-search:
    #       ports:
    #         - "127.0.0.1:8120:8120"
    # 健康探针刻意打 /healthz（进程存活）而不是 /readyz（至少配了一个可读后端），
    # 理由与 gorge-mailer 完全相同：下面 phorge 的 depends_on 用的是 service_healthy，
    # 若这里探 /readyz，一个还没配后端的 gorge-search 会把整个站点堵在启动阶段——
    # 搜不了不该等同于站点起不来。「服务活着但一个后端都没配」这个状态由
    # PhabricatorGorgeSearchSetupCheck 在 Config 页面报出来。
    # 注意 gorge 仓库自己的 deploy/compose 里探的是 /readyz，那里没有别的服务依赖它。
    # 同样用 busybox 的 wget：镜像基于 alpine，没有 curl。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8120/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-file-storage 把 MySQL blob、本地磁盘、S3/MinIO 收在一个 HTTP API
  # （路由 /api/file/*）后面，容器内固定监听 8100。Phorge 侧它是一个自动被发现的
  # PhabricatorFileStorageEngine（identifier: gorge），见
  # src/applications/files/engine/PhabricatorGorgeFileStorageEngine.php。
  #
  # 与另外四个服务有两处结构性不同：
  #   - **它有状态。** 本地磁盘后端写下面新增的 phorge-files 卷；blob 后端写的是
  #     phorge 自己的 {namespace}_file.file_storageblob 表，所以它和后面的
  #     gorge-webhook 是这六个服务里仅有的两个需要 depends_on mysql 与 db-init 的。
  #   - **字节不走 JSON 信封。** 写/读文件的请求体与响应体都是原始
  #     application/octet-stream，只有元数据、删除与引擎列表仍是 {data, error}。
  #     PHP 侧对应 PhabricatorGorgeServiceClient::parseBinaryResponse()。
  gorge-file-storage:
    image: ghcr.io/soulteary/gorge:file-storage-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-file-storage
    restart: unless-stopped
    depends_on:
      # blob 后端要连库，所以等 mysql 健康。注意这**不会**和 phorge 形成环：
      # phorge 只等 gorge-file-storage 容器启动，不等它健康。
      mysql:
        condition: service_healthy
      # 也要等 db-init：它给普通账号补的是 `phabricator_%` 整组库的权限，没这一步
      # blob 后端连得上 mysql 却看不到 phabricator_file 库。
      db-init:
        condition: service_completed_successfully
    environment:
      # 监听地址固定 :8100。下面的健康检查与 phorge 的 GORGE_FILE_URI 默认值都按它
      # 写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8100"
      # 服务间共享密钥，PHP 客户端以请求头 X-Service-Token 发送，两端必须同值，所以
      # 这里和 phorge 都取同一个 GORGE_FILE_TOKEN。留空表示服务端不鉴权：
      # gorge-file-storage 不对宿主暴露端口、只在 compose 内网可达，因此默认留空。
      # 但它和 gorge-mailer 一样值得设一个值——能往这个口投请求就等于能读写、删除
      # 站点上的任意文件（读只需要一个 handle）。
      GORGE_SERVICE_TOKEN: ${GORGE_FILE_TOKEN:-}

      # 下面每一项都用 GORGE_FILE_ 前缀，这是服务读配置时的**首选名**。无前缀的旧名
      # （MYSQL_HOST / STORAGE_NAMESPACE / S3_BUCKET …）服务也认，但那是留给独立服务
      # 时期旧部署的兜底，不该在新编排里用——这个容器里 MYSQL_* 若按无前缀写，就和
      # phorge 容器里同名却指别的东西的那一组撞了名字（见 docker/entrypoint.sh 的
      # db_ready）。
      #
      # --- blob 后端（MySQL）---
      # 连库参数取的仍是基础编排里那一组 .env 变量，不另开一份：写错的表现不是报错，
      # 而是 blob 写入失败后**静默下沉**到本地磁盘后端，事后只能靠 file 表里的引擎标识
      # 才看得出来。与 phorge 段一样把 host/port 写成字面量，它们是 compose 内部拓扑。
      GORGE_FILE_MYSQL_HOST: mysql
      GORGE_FILE_MYSQL_PORT: "3306"
      GORGE_FILE_MYSQL_USER: ${MYSQL_USER:-phorge}
      GORGE_FILE_MYSQL_PASS: ${MYSQL_PASSWORD:-phorge}
      # 库名前缀，必须与 Phorge 的 storage.default-namespace 一致 —— blob 后端写的
      # 是 {namespace}_file.file_storageblob，也就是 Phorge 原生 MySQL 引擎用的**同一张
      # 表**。Phorge 该配置项的默认值是 phabricator，本编排没有改它，所以这里也是
      # phabricator。**这一项必须显式给值**：服务端的默认值是 phorge，靠默认值会连到
      # 一个不存在的库，而表现同样是静默下沉到本地磁盘。
      GORGE_FILE_NAMESPACE: ${GORGE_FILE_NAMESPACE:-phabricator}
      # 单个 blob 的大小上限（字节），超过就交给下一个后端。默认 1MiB，与 Phorge 的
      # storage.mysql-engine.max-size 默认值一致。设成 0 表示不启用 blob 后端。
      GORGE_FILE_MYSQL_BLOB_MAX_SIZE: ${GORGE_FILE_MYSQL_BLOB_MAX_SIZE:-1048576}

      # --- 本地磁盘后端 ---
      # 容器内路径，对应下面挂的 phorge-files 卷。这是**默认就可写的那个后端**，也是
      # gorge-file-storage 不像 gorge-mailer / gorge-search 那样需要你先配后端的原因。
      # 留空表示不启用本地磁盘后端；这么做之前请确认 blob 或 S3 至少有一个可写，否则
      # /readyz 不通，而下面 phorge 的 depends_on 探的正是 /readyz。
      GORGE_FILE_LOCAL_DISK_PATH: ${GORGE_FILE_LOCAL_DISK_PATH:-/var/gorge/files}

      # --- S3 / MinIO 后端 ---
      # 五项**全部**非空才启用，缺一项就整组不注册（半套配置会造出一个每次请求都失败的
      # 客户端）。注意 S3 后端的 key 前缀格式是**存量文件的读取依据**，改了以后旧文件
      # 读不出来且不报错，所以别在有数据之后调整它。
      GORGE_FILE_S3_BUCKET: ${GORGE_FILE_S3_BUCKET:-}
      GORGE_FILE_S3_REGION: ${GORGE_FILE_S3_REGION:-}
      GORGE_FILE_S3_ENDPOINT: ${GORGE_FILE_S3_ENDPOINT:-}
      GORGE_FILE_S3_ACCESS_KEY: ${GORGE_FILE_S3_ACCESS_KEY:-}
      GORGE_FILE_S3_SECRET_KEY: ${GORGE_FILE_S3_SECRET_KEY:-}
    volumes:
      # 本地磁盘后端的数据目录。这是本叠加文件引入的唯一一个卷，删掉它等于删掉所有
      # 落在 local-disk 后端的文件——Phorge 侧只存 handle，数据全在这儿。
      - phorge-files:/var/gorge/files
    # 与另外四个服务同理刻意不声明 ports：只有 phorge 通过 compose 默认网络的服务名
    # gorge-file-storage 调用它。不鉴权时它是一个能读写删站点全部文件的开放接口。
    # 需要在宿主上直连排障时，用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-file-storage:
    #       ports:
    #         - "127.0.0.1:8100:8100"
    #
    # 健康探针探 /readyz（至少一个后端已启用，且 blob 启用时能连上 {namespace}_file 库），
    # 这与 gorge-mailer / gorge-search 刻意只探 /healthz 的做法相反：本服务开箱就有一个
    # 可写后端（上面的本地磁盘），所以这个探针问的是一个有意义的问题，而不是一个永远
    # 答不上来的问题。docker ps 上的 healthy/unhealthy 因此能直接读作「blob 后端通不通」。
    #
    # **但下面 phorge 段刻意没有用 service_healthy 等它**，尽管这个探针本身是有意义的。
    # 首次启动时它必然为 503：blob 后端的 DSN 带 {namespace}_file 这个库名，而库要等
    # phorge 的 bin/storage upgrade 建出来。让 phorge 等它就成了死锁，理由与代价见下面
    # phorge.depends_on 里 gorge-file-storage 那一条的注释。
    #
    # 那段 unhealthy 的窗口不影响可用性：blob 写不进去时，写入按 priority 下沉到本地磁盘
    # 后端，上传照常成功。gorge 侧的 /readyz 也刻意**不检查** file_storageblob 表是否
    # 存在（compat/phorge/README.md 第 8.7 节把这条列为约定），那是对的 —— 只是不查表
    # 还不够，DSN 里的库名在 ping 之前就已经把这个依赖引进来了。
    # 同另外四个服务用 busybox 的 wget：镜像基于 alpine，没有 curl。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8100/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-webhook 接管 Herald 的 webhook 投递（容器内固定监听 :8160）。它是六个服务
  # 里最特别的一个，因为**它不被 phorge 调用**：
  #
  #   - 队列就是数据库。PHP 侧照旧把 webhook request 写进
  #     {namespace}_herald.herald_webhookrequest，本服务自己轮询 status='queued' 的行，
  #     抢占、HMAC 签名 POST、再把结果回写同一行。两边之间没有任何 HTTP 调用。
  #   - 因此 gorge.webhook.uri **不是「服务地址」而是「交接开关」**：phorge 侧读到它
  #     非空（且未开全局静默）就不再给 HeraldWebhookWorker 派任务，见
  #     PhabricatorGorgeWebhookClient::isDeliveryDelegated()。
  #   - 由此得到一条必须记住的失配规则：**这个容器在跑、而 gorge.webhook.uri 没写进
  #     phorge**，等于 phd 与本服务同时投递同一批行 —— webhook 会发两次。所以本段与
  #     下面 phorge 段里的 GORGE_WEBHOOK_URI 是一对，要删就两段一起删。
  #     entrypoint.sh 写失败时会专门为这种情况打一条告警。
  #
  # 它和 gorge-file-storage 一样有状态、一样依赖 mysql 与 db-init；下面那个
  # {namespace}_herald 库的存在性问题是它独有的，见 healthcheck 那段注释。
  gorge-webhook:
    image: ghcr.io/soulteary/gorge:webhook-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-webhook
    restart: unless-stopped
    depends_on:
      # 队列在库里，所以等 mysql 健康。与 gorge-file-storage 同理不会成环：这里没有
      # 让 phorge 等它「健康」（见下面 healthcheck 那段）。
      mysql:
        condition: service_healthy
      # 也要等 db-init：它给普通账号补的是 `phabricator_%` 整组库的权限，没这一步
      # 连得上 mysql 却看不到 phabricator_herald 库。
      db-init:
        condition: service_completed_successfully
    environment:
      # 监听地址固定 :8160。下面的健康检查与 phorge 的 GORGE_WEBHOOK_URI 默认值都按它
      # 写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8160"
      # 服务间共享密钥，两端必须同值。注意它保护的**只是** /api/webhook/stats 与
      # /api/webhook/hooks 这两个诊断接口（PHP 侧只有 Config 页面的 setup check 会读
      # 它们），投递本身不经过这个 token —— 投递走数据库，签名用的是每个 hook 自己的
      # HMAC key。所以这里留空的风险比其它几个服务小：泄露的上限是队列计数。
      GORGE_SERVICE_TOKEN: ${GORGE_WEBHOOK_TOKEN:-}

      # 下面每一项都用 GORGE_WEBHOOK_ 前缀，这是服务读配置时的**首选名**。无前缀的旧名
      # （MYSQL_HOST / STORAGE_NAMESPACE / SERVICE_TOKEN …）服务也认，但那是留给独立
      # 服务时期旧部署的兜底，不该在新编排里用 —— 这个容器里 MYSQL_* 若按无前缀写，就和
      # phorge 容器里同名却指别的东西的那一组撞了名字（见 docker/entrypoint.sh 的
      # db_ready）。
      #
      # 连库参数取的仍是基础编排里那一组 .env 变量，不另开一份：这不是「服务自己的库」，
      # 就是 phorge 的库，写错等于接管失败。
      GORGE_WEBHOOK_MYSQL_HOST: mysql
      GORGE_WEBHOOK_MYSQL_PORT: "3306"
      GORGE_WEBHOOK_MYSQL_USER: ${MYSQL_USER:-phorge}
      GORGE_WEBHOOK_MYSQL_PASS: ${MYSQL_PASSWORD:-phorge}
      # 库名前缀，必须与 Phorge 的 storage.default-namespace 一致 —— 服务连的是
      # {namespace}_herald 这个库。Phorge 该配置项的默认值是 phabricator，本编排没有改
      # 它，所以这里也是 phabricator。**这一项必须显式给值**：服务端的默认值是 phorge，
      # 靠默认值会连到一个不存在的库，表现是 /readyz 永远不通、队列一直堆着不投递。
      GORGE_WEBHOOK_NAMESPACE: ${GORGE_WEBHOOK_NAMESPACE:-phabricator}

      # --- 投递行为（都有服务端默认值，留空即用默认）---
      # 全部留空是刻意的：这几项调错的代价不对称，调小了会放大失败重投的压力，调大了会
      # 让「事务发生到 webhook 送达」的延迟变长，而默认值是照着 PHP 侧原本的行为定的。
      # 轮询间隔（毫秒，默认 1000）。
      GORGE_WEBHOOK_POLL_INTERVAL_MS: ${GORGE_WEBHOOK_POLL_INTERVAL_MS:-}
      # 单次投递的 HTTP 超时（秒，默认 15），与 PHP 侧 HeraldWebhookWorker 的 15 一致。
      GORGE_WEBHOOK_DELIVERY_TIMEOUT: ${GORGE_WEBHOOK_DELIVERY_TIMEOUT:-}
      # 并发投递上限（默认 8）。
      GORGE_WEBHOOK_MAX_CONCURRENT: ${GORGE_WEBHOOK_MAX_CONCURRENT:-}
      # 单个 hook 连续失败到多少次进入熔断（默认 10），以及熔断窗口（秒，默认 300）。
      # 这两项对应 PHP 侧 HeraldWebhook::isInErrorBackoff() 的同名行为。
      GORGE_WEBHOOK_ERROR_THRESHOLD: ${GORGE_WEBHOOK_ERROR_THRESHOLD:-}
      GORGE_WEBHOOK_ERROR_BACKOFF_SEC: ${GORGE_WEBHOOK_ERROR_BACKOFF_SEC:-}
      # 单个失败请求隔多久才重投（秒，默认 60）。它和上面那个熔断窗口是**两个不同的量**：
      # 这一项管一个 request 的重试节奏，那一项管整个 hook 停投多久。
      # 60 是照着 PHP 侧来的 —— worker 抛异常后由 PhabricatorWorkerLeaseQuery 的默认重试
      # 等待接手。独立服务时期没有这一项，失败下一个 tick 就重投，于是十秒就能把一个 hook
      # 烧进熔断。设成 0 等于退回那个行为，不建议。
      GORGE_WEBHOOK_RETRY_BACKOFF_SEC: ${GORGE_WEBHOOK_RETRY_BACKOFF_SEC:-}
      # 一个已被抢占的 request 隔多久才允许另一次尝试接手（秒，默认 30）。它只回答
      # 「抢到这行的进程死了」这一个问题：正常结束的投递会写回结果并离开队列。
      # 低于 GORGE_WEBHOOK_DELIVERY_TIMEOUT 时服务端会自动抬到与它相等 —— 租约比一次
      # 投递还短，等于把 claim 要防的重复投递又放回来了。
      GORGE_WEBHOOK_CLAIM_LEASE_SEC: ${GORGE_WEBHOOK_CLAIM_LEASE_SEC:-}
    # 与其余五个服务同理刻意不声明 ports：本服务连 phorge 都不调用它，只有排障时才需要
    # 宿主入口。要直连时用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-webhook:
    #       ports:
    #         - "127.0.0.1:8160:8160"
    #
    # 健康探针探 /readyz（能连上 {namespace}_herald 库），与 gorge-file-storage 一致：
    # 连不上库就等于一条都投不出去，而那个状态从 Herald 界面上看和「服务慢了一拍」完全
    # 一样（request 都停在蓝色的 Queued 图标上），必须有个地方能看出来。
    #
    # **但下面 phorge 段刻意没有用 service_healthy 等它**，这一点和 gorge-file-storage
    # 相反，理由是首次启动会死锁：{namespace}_herald 这个库是 phorge 容器里的
    # bin/storage upgrade 建的，而本服务的就绪条件正是 ping 到这个库。让 phorge 等它健康
    # 就成了「phorge 等服务、服务等只有 phorge 能建的库」。
    # 所以首次启动时本容器会有一段 unhealthy 的窗口，直到 phorge 跑完 storage upgrade，
    # 这是预期的，不是故障。同另外五个服务用 busybox 的 wget：镜像基于 alpine，没有 curl。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8160/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-taskqueue 把 Phorge 的 daemon 工作队列搬到一个 HTTP API 后面（路由
  # /api/queue/*），容器内固定监听 :8090。它拥有 {namespace}_worker 库里的
  # worker_activetask / worker_taskdata / worker_archivetask 三张表：enqueue 入队、
  # lease 把行租给 worker、complete/fail/yield/cancel/awaken 推进任务生命周期。
  # 下面的 gorge-worker 是它唯一的客户端。
  #
  # 它与 gorge-webhook / gorge-file-storage 一样**有状态**、一样以数据库为后端：
  # 队列就是 {namespace}_worker 库，没有它这个服务什么都做不了。因此它也是需要
  # depends_on mysql 与 db-init 的服务之一。
  #
  # 与 webhook 的接管开关不同，taskqueue 是 phorge **主动调用**的：PHP 侧
  # PhabricatorWorkerLeaseQuery / PhabricatorWorker / PhabricatorWorkerActiveTask
  # 在读到 gorge.taskqueue.uri 非空时，enqueue / lease / complete / fail / yield /
  # cancel / awaken 全部改走这个服务，否则回落原生 SQL 队列。
  #
  # **硬约束（compat）**：它必须**替换**而不是**并存于** phd 的 taskmaster 守护进程。
  # 两个消费者虽然都向本服务原子 lease、同一任务不会被领两次，但让 phd 的 taskmaster
  # 和 gorge-worker 同时消费同一个队列是语义混乱且浪费的（两套执行环境、两处 lease
  # 争抢）。所以下面 phorge 段的 entrypoint 在配置了 GORGE_TASKQUEUE_URI 时会把
  # phd.taskmasters 关到 0（见 entrypoint.sh 与 docker/entrypoint 的注释），把队列的
  # 消费权完整交给 gorge-worker。
  gorge-taskqueue:
    image: ghcr.io/soulteary/gorge:taskqueue-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-taskqueue
    restart: unless-stopped
    depends_on:
      # 队列在库里，所以等 mysql 健康。与 gorge-file-storage / gorge-webhook 同理不会
      # 与 phorge 成环：这里没有让 phorge 等它「健康」（见下面 healthcheck 那段与
      # phorge.depends_on 里 gorge-taskqueue 那一条）。
      mysql:
        condition: service_healthy
      # 也要等 db-init：它给普通账号补的是 `phabricator_%` 整组库的权限，没这一步
      # 连得上 mysql 却看不到 phabricator_worker 库。
      db-init:
        condition: service_completed_successfully
    environment:
      # 监听地址固定 :8090。下面的健康检查与 phorge 的 GORGE_TASKQUEUE_URI 默认值都
      # 按它写死，改这里要三处一起改。
      GORGE_LISTEN_ADDR: ":8090"
      # 服务间共享密钥，PHP 客户端以请求头 X-Service-Token 发送，两端必须同值，所以
      # 这里和 phorge 都取同一个 GORGE_TASKQUEUE_TOKEN。留空表示服务端不鉴权：
      # gorge-taskqueue 不对宿主暴露端口、只在 compose 内网可达，因此默认留空。
      # 但它值得设一个值——能往这个口投请求就等于能操纵整个任务队列（入队、领取、
      # 归档任意任务），一旦把它接进共享网络，务必设。
      GORGE_SERVICE_TOKEN: ${GORGE_TASKQUEUE_TOKEN:-}
      # 队列后端："mysql"（默认）或 "redis"。下面的 GORGE_TASKQUEUE_REDIS_* 只在这里
      # 是 "redis" 时才被读到。默认走 MySQL，也就是 phorge 自己的 {namespace}_worker 库。
      GORGE_TASKQUEUE_BACKEND: ${GORGE_TASKQUEUE_BACKEND:-mysql}

      # 下面每一项都用 GORGE_TASKQUEUE_ 前缀，这是服务读配置时的**首选名**。无前缀的
      # 旧名（MYSQL_HOST / STORAGE_NAMESPACE / QUEUE_BACKEND …）服务也认，但那是留给
      # 独立服务时期旧部署的兜底，不该在新编排里用——这个容器里 MYSQL_* 若按无前缀写，
      # 就和 phorge 容器里同名却指别的东西的那一组撞了名字（见 docker/entrypoint.sh 的
      # db_ready）。
      #
      # 连库参数取的仍是基础编排里那一组 .env 变量，不另开一份：这不是「服务自己的库」，
      # 就是 phorge 的库，写错等于队列接管失败。与 phorge 段一样把 host/port 写成字面量，
      # 它们是 compose 内部拓扑。
      # 注意变量名是 GORGE_TASKQUEUE_MYSQL_PASS（PASS，不是 PASSWORD）——与 config.go 的
      # config.EnvStr("", "GORGE_TASKQUEUE_MYSQL_PASS", "MYSQL_PASS") 对齐。
      GORGE_TASKQUEUE_MYSQL_HOST: mysql
      GORGE_TASKQUEUE_MYSQL_PORT: "3306"
      GORGE_TASKQUEUE_MYSQL_USER: ${MYSQL_USER:-phorge}
      GORGE_TASKQUEUE_MYSQL_PASS: ${MYSQL_PASSWORD:-phorge}
      # 库名前缀，必须与 Phorge 的 storage.default-namespace 一致 —— 服务连的是
      # {namespace}_worker 这个库。Phorge 该配置项的默认值是 phabricator，本编排没有
      # 改它，所以这里也是 phabricator。**这一项必须显式给值**：服务端的默认值是 phorge，
      # 靠默认值会连到一个不存在的库，表现是 /readyz 永远不通、队列一直入不了队。
      GORGE_TASKQUEUE_NAMESPACE: ${GORGE_TASKQUEUE_NAMESPACE:-phabricator}

      # --- Redis 后端（仅 GORGE_TASKQUEUE_BACKEND=redis 时读取）---
      # 把队列从主库挪到 Redis 的部署才用得上；后端实例本身刻意不放进这个编排，
      # 指向本编排之外的实例即可。
      GORGE_TASKQUEUE_REDIS_ADDR: ${GORGE_TASKQUEUE_REDIS_ADDR:-}
      GORGE_TASKQUEUE_REDIS_PASSWORD: ${GORGE_TASKQUEUE_REDIS_PASSWORD:-}
      GORGE_TASKQUEUE_REDIS_DB: ${GORGE_TASKQUEUE_REDIS_DB:-0}
      GORGE_TASKQUEUE_REDIS_KEY_PREFIX: ${GORGE_TASKQUEUE_REDIS_KEY_PREFIX:-gorge:tq:}

      # --- 队列行为（都有服务端默认值，留空即用默认）---
      # 一个被租出去的任务隔多久才允许另一个 worker 接手（秒，默认 7200 = 2 小时，与
      # Phorge 的 PhabricatorWorkerLeaseQuery 默认租约一致）；一个临时失败的任务隔多久
      # 才重新可租（秒，默认 300 = 5 分钟，与 Phorge 的 getWaitBeforeRetry 默认值一致）。
      GORGE_TASKQUEUE_LEASE_DURATION: ${GORGE_TASKQUEUE_LEASE_DURATION:-7200}
      GORGE_TASKQUEUE_RETRY_WAIT: ${GORGE_TASKQUEUE_RETRY_WAIT:-300}
    # 与其余服务同理刻意不声明 ports：只有 phorge 与 gorge-worker 通过 compose 默认
    # 网络的服务名 gorge-taskqueue 调用它。不鉴权时它是一个能操纵整个队列的开放接口。
    # 需要在宿主上直连排障时，用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-taskqueue:
    #       ports:
    #         - "127.0.0.1:8090:8090"
    #
    # 健康探针探 /readyz（能连上 {namespace}_worker 库），与 gorge-webhook /
    # gorge-file-storage 一致：连不上库就等于一个任务都入不了队、领不出来，而这个
    # 状态必须有个地方能看出来。
    #
    # **但下面 phorge 段刻意没有用 service_healthy 等它**，理由与 gorge-webhook 完全
    # 相同——首次启动会死锁：{namespace}_worker 这个库是 phorge 容器里的
    # bin/storage upgrade 建的，而本服务的就绪条件正是 ping 到这个库。让 phorge 等它
    # 健康就成了「phorge 等服务、服务等只有 phorge 能建的库」。所以首次启动时本容器
    # 会有一段 unhealthy 的窗口，直到 phorge 跑完 storage upgrade，这是预期的、不是
    # 故障：taskqueue 侧用 lazy pool + /readyz 未就绪重试容忍库/表暂不存在。
    # 同其余服务用 busybox 的 wget：镜像基于 alpine，没有 curl。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-worker 是 Phorge 的 taskmaster 守护进程搬成的独立进程，容器内固定监听
  # :8170。它是上面那条流水线的**客户端**：通过 HTTP 从 gorge-taskqueue 领任务、
  # 执行、再把每个结果回报（complete / fail / yield），行为与
  # PhabricatorTaskmasterDaemon 对本地队列做的完全一致。它自己不碰任何数据库，唯一的
  # 依赖就是 gorge-taskqueue，这也是这两个服务是两个二进制而不是一个的原因。
  #
  # 它唯一的 HTTP 路由是 GET /api/worker/stats，健康探针探 /healthz 而不是 /readyz：
  # 它没有自己的外部存储要证明可达，就绪就等于存活。一个连不上 taskqueue 的 worker
  # 只是领不到任务、继续重试而已——那是 taskqueue 的问题，由 taskqueue 自己的 /readyz
  # 报出来，不是重启这个容器的理由。
  #
  # 不配 GORGE_WORKER_CONDUIT_URL 时，它只跑自己原生实现的任务类、其余的一概失败。
  # 把它指向 gorge-conduit（Conduit API 网关）就装上一个兜底 handler，把每一个它不
  # 认识的任务类经 Conduit 委派回 phorge 的 PHP 后端执行。本编排里 gorge-conduit 段
  # 存在，所以默认就指过去。
  gorge-worker:
    image: ghcr.io/soulteary/gorge:worker-${GORGE_IMAGE_TAG:-latest}
    container_name: phorge-gorge-worker
    restart: unless-stopped
    depends_on:
      # 只等 taskqueue 容器启动，不等健康：首次安装要由 Phorge migration 建 worker
      # 数据库，而 fallback/off 也必须能在队列服务故障时启动 Phorge。
      gorge-taskqueue:
        condition: service_started
    environment:
      # 监听地址固定 :8170。下面的健康检查按它写死，改这里要两处一起改。
      GORGE_LISTEN_ADDR: ":8170"
      # 服务间共享密钥。worker 既是 taskqueue 的 HTTP 客户端、又自己暴露 /api/worker/stats，
      # 所以这里的 GORGE_SERVICE_TOKEN 保护的是它自己的 stats 接口；它调 taskqueue 用的
      # 是下面的 GORGE_WORKER_TASK_QUEUE_TOKEN。两者默认都取同一个 GORGE_TASKQUEUE_TOKEN，
      # 因为整条流水线共用一个信任域。
      GORGE_SERVICE_TOKEN: ${GORGE_TASKQUEUE_TOKEN:-}
      # 它要领任务的 taskqueue 服务地址与 token。默认按 compose 服务名解析兄弟服务的
      # :8090；token 必须与 taskqueue 的 GORGE_SERVICE_TOKEN 同值，所以默认取同一个
      # GORGE_TASKQUEUE_TOKEN。变量名与 config.go 的
      # config.EnvStr(..., "GORGE_WORKER_TASK_QUEUE_URL", "TASK_QUEUE_URL") 对齐。
      GORGE_WORKER_TASK_QUEUE_URL: ${GORGE_WORKER_TASK_QUEUE_URL:-http://gorge-taskqueue:8090}
      GORGE_WORKER_TASK_QUEUE_TOKEN: ${GORGE_WORKER_TASK_QUEUE_TOKEN:-${GORGE_TASKQUEUE_TOKEN:-}}
      # Conduit 兜底网关：把 worker 不原生支持的任务类委派回 phorge 的 PHP 后端。
      # 本编排里 gorge-conduit 段固定监听 :8150，所以默认指过去；token 与网关的
      # GORGE_SERVICE_TOKEN 同值，默认取同一个 GORGE_CONDUIT_TOKEN。留空 URL 则关闭
      # 兜底，worker 只跑原生任务类。变量名与 config.go 的
      # config.EnvStr("", "GORGE_WORKER_CONDUIT_URL", "CONDUIT_URL") 对齐。
      GORGE_WORKER_CONDUIT_URL: ${GORGE_WORKER_CONDUIT_URL:-http://gorge-conduit:8150}
      GORGE_WORKER_CONDUIT_TOKEN: ${GORGE_WORKER_CONDUIT_TOKEN:-${GORGE_CONDUIT_TOKEN:-}}
      # --- 领取循环行为（都有服务端默认值，留空即用默认）---
      # 每次 poll 领多少任务、poll 间隔（毫秒）、同时跑多少个、空闲多久后退避（秒）。
      GORGE_WORKER_LEASE_LIMIT: ${GORGE_WORKER_LEASE_LIMIT:-4}
      GORGE_WORKER_POLL_INTERVAL_MS: ${GORGE_WORKER_POLL_INTERVAL_MS:-1000}
      GORGE_WORKER_MAX_WORKERS: ${GORGE_WORKER_MAX_WORKERS:-4}
      GORGE_WORKER_IDLE_TIMEOUT_SEC: ${GORGE_WORKER_IDLE_TIMEOUT_SEC:-180}
      # 逗号分隔的任务类白名单；留空表示 worker 支持的全部任务类。变量名与 config.go 的
      # config.EnvStr("", "GORGE_WORKER_TASK_CLASS_FILTER", "TASK_CLASS_FILTER") 对齐。
      GORGE_WORKER_TASK_CLASS_FILTER: ${GORGE_WORKER_TASK_CLASS_FILTER:-}
    # 与其余服务同理刻意不声明 ports：只有排障时才需要宿主入口访问它的 stats。
    # 需要直连时用 docker-compose.override.yml 另加回环映射：
    #   services:
    #     gorge-worker:
    #       ports:
    #         - "127.0.0.1:8170:8170"
    #
    # 健康探针探 /healthz（进程存活）而不是 /readyz，理由见上面段首注释：worker 没有
    # 自己的外部存储，就绪即存活。同其余服务用 busybox 的 wget：镜像基于 alpine，没有 curl。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8170/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # gorge-db-api 把 Phorge 对自身 MySQL 集群的只读诊断收进一个 HTTP API：数据库
  # 健康、schema 差异、环境检查与 storage upgrade 进度都由它现查后返回。它不建库、
  # 不跑迁移，也不修改业务表。
  gorge-db-api:
    image: ghcr.io/soulteary/gorge:db-api-${GORGE_DB_IMAGE_TAG:-${GORGE_IMAGE_TAG:-latest}}
    container_name: phorge-gorge-db-api
    restart: unless-stopped
    depends_on:
      # 服务要连接基础编排里的 MySQL，并复用 Phorge 普通账号。先等数据库可连接、授权
      # 完成，避免启动后的第一次诊断落在一个必然失败的窗口里。
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      GORGE_LISTEN_ADDR: ":8080"
      # 同一个值也会下发给 phorge，写进 gorge.db.token。生产必须非空：留空会关闭
      # 服务端鉴权，任何能连到 :8080 的客户端都能读到集群拓扑与各节点状态。
      GORGE_SERVICE_TOKEN: ${GORGE_DB_TOKEN:-}
      # 单节点默认直接复用基础编排的数据库账号，方便开箱即用。db-api 只执行 SHOW、
      # SELECT 与 INFORMATION_SCHEMA 查询，不需要 DDL 权限——所以生产环境不应让它
      # 复用 root / MYSQL_USER 这种全权限账号。为它建一个最小权限只读账号并改用它：
      #
      #   CREATE USER 'gorge_dbapi_ro'@'%' IDENTIFIED BY '...';
      #   GRANT SELECT ON `information_schema`.* TO 'gorge_dbapi_ro'@'%';
      #   GRANT SELECT ON `phabricator_meta_data`.* TO 'gorge_dbapi_ro'@'%';
      #   GRANT SHOW VIEW ON *.* TO 'gorge_dbapi_ro'@'%';
      #   GRANT REPLICATION CLIENT ON *.* TO 'gorge_dbapi_ro'@'%';
      #
      # 然后把 GORGE_DB_MYSQL_USER / _PASS 指向它（见 DOCKER.md「用 Gorge 做数据库
      # 诊断」一节，含 MySQL 8 / MariaDB 最小权限集验证说明与多节点专用配置文件示例）。
      GORGE_DB_MYSQL_HOST: mysql
      GORGE_DB_MYSQL_PORT: "3306"
      GORGE_DB_MYSQL_USER: ${GORGE_DB_MYSQL_USER:-${MYSQL_USER:-phorge}}
      GORGE_DB_MYSQL_PASS: ${GORGE_DB_MYSQL_PASS:-${MYSQL_PASSWORD:-phorge}}
      # 必须与 Phorge 的 storage.default-namespace 一致。
      GORGE_DB_NAMESPACE: ${GORGE_DB_NAMESPACE:-phabricator}
      # 可选的 Phorge local.json 路径。非空时 db-api fail closed（文件缺失/JSON 非法/
      # 无可用 master 会启动失败，而不是退回单节点），且要通过第三个 compose override
      # 把配置文件只读挂入容器；服务从 cluster.databases 读取完整拓扑。默认空值用上面
      # 的单节点。多节点建议挂一份只含 namespace/节点/角色/分区/只读账号引用的专用文件，
      # 而不是整份 local.json——见 DOCKER.md。
      GORGE_DB_CONFIG_FILE: ${GORGE_DB_CONFIG_FILE:-}
    # 刻意不发布宿主端口：只有 phorge 通过 compose 内网访问它。
    healthcheck:
      # 必须探 /healthz，而不是 /readyz：容器健康只表达进程存活，数据库可达性由
      # /readyz 与 PhabricatorGorgeDBSetupCheck 报告，不能阻塞 Phorge 自身首启。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Gitea 到 Maniphest 的单向事件桥。Gitea 从宿主或反代访问 8180，桥接服务通过
  # 内网的 gorge-conduit 写任务评论；它从不以 Gitea 用户身份写入，身份归 Stargate。
  gorge-gitea:
    image: ghcr.io/soulteary/gorge:gitea-${GORGE_GITEA_IMAGE_TAG:-${GORGE_IMAGE_TAG:-latest}}
    container_name: phorge-gorge-gitea
    restart: unless-stopped
    profiles: ["gitea"]
    depends_on:
      gorge-conduit:
        condition: service_healthy
    environment:
      GORGE_LISTEN_ADDR: ":8180"
      GORGE_SERVICE_TOKEN: ${GORGE_GITEA_SERVICE_TOKEN:-}
      GORGE_GITEA_BASE_URL: ${GITEA_BASE_URI:-}
      GORGE_GITEA_WEBHOOK_SECRET: ${GORGE_GITEA_WEBHOOK_SECRET:-}
      GORGE_GITEA_CONDUIT_URL: ${GORGE_GITEA_CONDUIT_URL:-http://gorge-conduit:8150}
      GORGE_GITEA_CONDUIT_TOKEN: ${GORGE_GITEA_CONDUIT_TOKEN:-}
      GORGE_GITEA_GATEWAY_TOKEN: ${GORGE_GITEA_GATEWAY_TOKEN:-${GORGE_CONDUIT_TOKEN:-}}
      GORGE_GITEA_TIMEOUT_SEC: ${GORGE_GITEA_TIMEOUT_SEC:-15}
    ports:
      - "${GORGE_GITEA_PORT:-8180}:8180"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8180/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

# 本叠加文件引入的唯一一个卷。顶层 volumes 与基础 docker-compose.yml 里的那三个
# （phorge-db / phorge-conf / phorge-repo）合并，不会替换它们。
#
# 命名跟着基础文件用连字符。它装的是落在 local-disk 后端的文件数据本体，Phorge 侧
# 只存 handle，所以 `docker compose down -v` 会连它一起删掉，那些文件就永久没了。
volumes:
  phorge-files:
