# Opt-in image rollout. Default stack remains on the legacy implementation.
# docker compose -f docker-compose.yml -f docker-compose.image.yml up -d --build
services:
  gorge-image:
    build:
      context: ../gorge/go
      args:
        SERVICE: gorge-image
        PORT: 8190
    image: gorge-image:local
    restart: unless-stopped
    read_only: true
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      GORGE_LISTEN_ADDR: ':8190'
      GORGE_SERVICE_TOKEN: ${GORGE_IMAGE_TOKEN:?Set GORGE_IMAGE_TOKEN}
      GORGE_IMAGE_CONCURRENCY: '2'
      GORGE_IMAGE_TIMEOUT_SEC: '10'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8190/readyz']
      interval: 10s
      timeout: 3s
      retries: 3
  phorge-migrate:
    environment:
      GORGE_IMAGE_URI: http://gorge-image:8190
      GORGE_IMAGE_TOKEN: ${GORGE_IMAGE_TOKEN:?Set GORGE_IMAGE_TOKEN}
      GORGE_IMAGE_MODE: ${GORGE_IMAGE_MODE:-shadow}
      GORGE_IMAGE_SHADOW_PERCENT: ${GORGE_IMAGE_SHADOW_PERCENT:-10}
    depends_on:
      gorge-image:
        condition: service_healthy
