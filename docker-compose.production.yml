# Opt-in convergence of the existing production paths. Search projection
# generations remain shadow-only. Apply with docker-compose.yml, using
# --profile mailer --profile search --profile maintenance.
services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
  db-init:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
  gorge-render:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-render, PORT: 8140}
    image: gorge-render:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_RENDER_TOKEN:?Set GORGE_RENDER_TOKEN}
  gorge-webhook:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-webhook, PORT: 8160}
    image: gorge-webhook:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_WEBHOOK_TOKEN:?Set GORGE_WEBHOOK_TOKEN}
  gorge-db-api:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-db-api, PORT: 8080}
    image: gorge-db-api:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_DB_TOKEN:?Set GORGE_DB_TOKEN}
      # Explicitly provision a read-only account; never inherit MYSQL_USER.
      GORGE_DB_MYSQL_USER: ${GORGE_DB_MYSQL_USER:?Set dedicated read-only DB account}
      GORGE_DB_MYSQL_PASS: ${GORGE_DB_MYSQL_PASS:?Set read-only DB password}
  gorge-file-storage:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-file-storage, PORT: 8100}
    image: gorge-file-storage:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_FILE_TOKEN:?Set GORGE_FILE_TOKEN}
  gorge-image:
    extends:
      file: docker-compose.image.yml
      service: gorge-image
  gorge-mailer:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-mailer, PORT: 8110}
    image: gorge-mailer:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_MAILER_TOKEN:?Set GORGE_MAILER_TOKEN}
      GORGE_MAILER_DELIVERY_DSN: ${GORGE_MAILER_DELIVERY_DSN:?Set metamta delivery DSN}
  gorge-search:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-search, PORT: 8120}
    image: gorge-search:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_SEARCH_TOKEN:?Set GORGE_SEARCH_TOKEN}
  gorge-taskqueue:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-taskqueue, PORT: 8090}
    image: gorge-taskqueue:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_TASKQUEUE_TOKEN:?Set GORGE_TASKQUEUE_TOKEN}
  gorge-worker:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-worker, PORT: 8170}
    image: gorge-worker:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_WORKER_TOKEN:-${GORGE_TASKQUEUE_TOKEN:?Set GORGE_TASKQUEUE_TOKEN}}
      GORGE_WORKER_MAILER_URL: http://gorge-mailer:8110
      GORGE_WORKER_MAILER_TOKEN: ${GORGE_MAILER_TOKEN:?Set GORGE_MAILER_TOKEN}
      GORGE_WORKER_MAIL_OUTBOX_DSN: ${GORGE_MAILER_DELIVERY_DSN:?Set metamta delivery DSN}
  gorge-conduit:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-conduit, PORT: 8150}
    image: gorge-conduit:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_CONDUIT_TOKEN:?Set GORGE_CONDUIT_TOKEN}
  gorge-notification:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-notification, PORT: 22281}
    image: gorge-notification:local
    # Terminate browser TLS at a reverse proxy; keep admin off public interfaces.
    ports: !override
      - '127.0.0.1:${GORGE_NOTIFICATION_CLIENT_PORT:-22280}:22280'
      - '127.0.0.1:${GORGE_NOTIFICATION_ADMIN_PORT:-22281}:22281'
  gorge-maintenance:
    build:
      context: ../gorge/go
      args: {SERVICE: gorge-maintenance, PORT: 8200}
    image: gorge-maintenance:local
    environment:
      GORGE_SERVICE_TOKEN: ${GORGE_MAINTENANCE_TOKEN:?Set GORGE_MAINTENANCE_TOKEN}
      GORGE_MAINTENANCE_CACHE_DSN: ${GORGE_MAINTENANCE_CACHE_DSN:?Set cache writer DSN}
      GORGE_MAINTENANCE_CONDUIT_DSN: ${GORGE_MAINTENANCE_CONDUIT_DSN:?Set conduit writer DSN}
      GORGE_MAINTENANCE_DAEMON_DSN: ${GORGE_MAINTENANCE_DAEMON_DSN:?Set daemon writer DSN}
      GORGE_MAINTENANCE_DIFFERENTIAL_DSN: ${GORGE_MAINTENANCE_DIFFERENTIAL_DSN:?Set differential writer DSN}
      GORGE_MAINTENANCE_MULTIMETER_DSN: ${GORGE_MAINTENANCE_MULTIMETER_DSN:?Set multimeter writer DSN}
    volumes:
      - phorge-conf:/etc/phorge:ro
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8200/readyz']
  phorge-migrate:
    environment:
      # Bootstrap the guard before importing policies or handing off ownership.
      PHORGE_GORGE_POLICY: required
      GORGE_CLEANUP_GUARD: 'true'
      GORGE_IMAGE_URI: http://gorge-image:8190
      GORGE_IMAGE_TOKEN: ${GORGE_IMAGE_TOKEN:?Set GORGE_IMAGE_TOKEN}
      GORGE_IMAGE_MODE: gorge
      GORGE_IMAGE_MEME_MODE: ${GORGE_IMAGE_MEME_MODE:-legacy}
      GORGE_IMAGE_BUILTIN_MODE: ${GORGE_IMAGE_BUILTIN_MODE:-legacy}
      # Optional config jobs publish native mail after the base migration.
      GORGE_MAIL_DELIVERY_MODE: legacy
    depends_on:
      gorge-image:
        condition: service_healthy
  phorge-mailer-config:
    environment:
      PHORGE_GORGE_POLICY: required
      GORGE_MAIL_DELIVERY_MODE: native
      GORGE_MAILER_EXCLUSIVE: 'true'
      GORGE_TASKQUEUE_URI: http://gorge-taskqueue:8090
      GORGE_TASKQUEUE_TOKEN: ${GORGE_TASKQUEUE_TOKEN:?Set GORGE_TASKQUEUE_TOKEN}
      GORGE_TASKQUEUE_MODE: enable
  phorge-search-config:
    environment:
      PHORGE_GORGE_POLICY: required
      GORGE_MAIL_DELIVERY_MODE: native
      GORGE_SEARCH_EXCLUSIVE: 'true'
      GORGE_SEARCH_KEEP_MYSQL: '0'
    # Both jobs replace the deployment document; serialize their writes.
    depends_on:
      phorge-mailer-config:
        condition: service_completed_successfully
  phorge:
    depends_on:
      gorge-maintenance:
        condition: service_started
        required: true
      phorge-mailer-config:
        condition: service_completed_successfully
        required: true
      phorge-search-config:
        condition: service_completed_successfully
        required: true
    environment:
      PHORGE_GORGE_POLICY: required
      GORGE_MAIL_DELIVERY_MODE: native
      GORGE_MAINTENANCE_URI: http://gorge-maintenance:8200
      GORGE_MAINTENANCE_TOKEN: ${GORGE_MAINTENANCE_TOKEN:?Set GORGE_MAINTENANCE_TOKEN}
  phorge-daemon:
    environment:
      PHORGE_GORGE_POLICY: required
      GORGE_MAIL_DELIVERY_MODE: native
