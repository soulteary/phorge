name: PHP Core security baseline

on:
  pull_request:
    paths:
      - Dockerfile
      - docker/php/uploads.ini
      - docker/php/opcache.ini
      - support/runtime/php-version.php
      - deploy/acceptance/build-lock.json
      - deploy/acceptance/php_security.php
      - deploy/acceptance/run.py
      - .github/workflows/php-core-security.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/php/uploads.ini
      - docker/php/opcache.ini
      - support/runtime/php-version.php
      - deploy/acceptance/build-lock.json
      - deploy/acceptance/php_security.php
      - deploy/acceptance/run.py
      - .github/workflows/php-core-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-php-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate production PHP image and session hardening
        shell: bash
        run: |
          set -euo pipefail
          image="$(sed -n 's/^ARG PHP_BASE_IMAGE=//p' Dockerfile | head -n1)"
          if [[ ! "$image" =~ ^php:8\.5\.12-apache$ ]]; then
            echo "::error::Expected the PHP 8.5.12 Apache production baseline, found: $image"
            exit 1
          fi
          locked_image="$(python3 -c 'import json; print(json.load(open("deploy/acceptance/build-lock.json"))["images"]["php"])')"
          [[ "$locked_image" =~ ^docker.io/library/php@sha256:[0-9a-f]{64}$ ]]
          for ref in "$image" "$locked_image"; do
            docker run --rm \
              -v "$PWD/docker/php/uploads.ini:/usr/local/etc/php/conf.d/phorge-uploads.ini:ro" \
              -v "$PWD/docker/php/opcache.ini:/usr/local/etc/php/conf.d/phorge-opcache.ini:ro" \
              -v "$PWD/deploy/acceptance/php_security.php:/tmp/php_security.php:ro" \
              "$ref" php /tmp/php_security.php
          done
      - name: Build and verify the locked production PHP application image
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('deploy/acceptance/build-lock.json').read_text())
          arguments = {
              'PHP_BASE_IMAGE': lock['images']['php'],
              'APCU_VERSION': lock['apcu'],
              'APCU_SHA256': lock['apcuSHA256'],
              'DEBIAN_SNAPSHOT': lock['debianSnapshot'],
          }
          command = ['docker', 'build', '--progress=plain', '--tag', 'phorge-security:ci']
          for name, value in arguments.items():
              command += ['--build-arg', name + '=' + value]
          subprocess.run(command + ['.'], check=True)
          subprocess.run(['docker', 'run', '--rm', '--entrypoint', 'php',
                          'phorge-security:ci', '/opt/phorge/phorge/deploy/acceptance/php_security.php'],
                         check=True)
          PYCODE
