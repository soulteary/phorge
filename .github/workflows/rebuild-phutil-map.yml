name: Rebuild Phutil library map

on:
  push:
    branches:
      - 'cleanup/apps-*'

permissions:
  contents: write

jobs:
  liberate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Do not leave a push credential in .git/config while third-party
          # code runs in this job. The commit step authenticates explicitly.
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none
      - name: Build bundled parser tools
        run: |
          php support/runtime/support/xhpast/build-xhpast.php
          php support/runtime/support/php-parser/build-php-parser.php
      - name: Rebuild library map
        id: liberate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php bin/rebuild-library-map 2>&1 | tee /tmp/rebuild-library-map.log
      - name: Upload liberate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-library-map-log
          path: /tmp/rebuild-library-map.log
      - name: Fail if liberate failed
        if: steps.liberate.outcome != 'success'
        run: exit 1
      - name: Verify runtime integrity after regeneration
        run: php scripts/runtime/verify.php
      - name: Verify map rebuild is reproducible
        run: |
          sha256sum src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json > /tmp/library-maps.sha256
          php bin/rebuild-library-map
          sha256sum --check /tmp/library-maps.sha256
          php scripts/runtime/verify.php
      - name: Commit generated map
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json
          git commit -m 'chore: regenerate Phutil library map [skip ci]'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
