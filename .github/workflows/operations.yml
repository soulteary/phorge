name: Operations safety and restore
on:
  push:
    paths: ['scripts/operations/**', 'tests/operations/**', 'bin/ops', '.github/workflows/operations.yml']
  pull_request:
    paths: ['scripts/operations/**', 'tests/operations/**', 'bin/ops', '.github/workflows/operations.yml']
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Integrity and failure gates
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/operations -v
      - name: Build PHP grant-audit fixture
        run: docker build -f tests/operations/php.Dockerfile -t phorge-operations-php:ci tests/operations
      - name: Disposable SQL and file-volume restore
        env:
          GORGE_TEST_PHP_IMAGE: phorge-operations-php:ci
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/operations/docker_roundtrip.py
