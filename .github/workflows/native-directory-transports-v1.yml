name: Native directory transport matrix v1
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directory-transports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: directory-transports-disposable-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pdirectory-transports-disposable-only" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: mysqli, mbstring, curl, gd, zip, dom, xmlreader, xmlwriter
          tools: composer:2.11.1
          coverage: none
      - name: Existing retained runtime and two standard mapper passes
        run: |
          python3 -B scripts/governance/check_directory_transports_v1.py --source-only --source-revision "$GITHUB_SHA"
          php -r 'exit(PHP_VERSION === "8.5.12" ? 0 : 1);'
          php scripts/runtime/build.php all
          php bin/rebuild-library-map
          git diff --exit-code -- src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json
          umask 077
          mkdir "$RUNNER_TEMP/directory-transports-v1"
          sha256sum src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json > "$RUNNER_TEMP/directory-transports-v1/verified-maps.sha256"
          php bin/rebuild-library-map
          sha256sum --check "$RUNNER_TEMP/directory-transports-v1/verified-maps.sha256"
          php scripts/runtime/verify.php
      - name: Actual local admission and strict-consumer regressions
        run: |
          python3 -B -m unittest discover -s tests/governance -p test_directory_transports.py -v
          python3 -B -m unittest discover -s tests/governance -p test_directory_transports_receipt_v1.py -v
          python3 -B -m unittest discover -s tests/governance -p test_directory_transport_failure_v1.py -v
      - name: Configure only disposable MySQL prerequisite
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_PWD: directory-transports-disposable-only
        run: |
          docker exec -e MYSQL_PWD "$MYSQL_CONTAINER" mysql --user=root --execute="SET GLOBAL sql_mode = 'STRICT_ALL_TABLES'; SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Real selected native matrix and strict source/receipt replay
        id: directory-sql
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/directory-transports-v1/verified-maps.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/directory-transports-v1/source-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/directory-transports-v1/source-tree.txt"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD=directory-transports-disposable-only \
          php support/governance/native-organization/test-directory-transports-v1-mysql.php --directory-transports > "$RUNNER_TEMP/directory-transports-v1/integration.json" 2> "$RUNNER_TEMP/directory-transports-native.private.stderr" || {
            native_status=$?
            if mkdir "$RUNNER_TEMP/directory-transports-safe-failure-v1"; then
              if python3 -B scripts/governance/project_directory_transport_failure_v1.py --stderr "$RUNNER_TEMP/directory-transports-native.private.stderr" --source-revision "$GITHUB_SHA" > "$RUNNER_TEMP/directory-transports-safe-failure-v1/diagnostic.pending.json"; then
                if mv "$RUNNER_TEMP/directory-transports-safe-failure-v1/diagnostic.pending.json" "$RUNNER_TEMP/directory-transports-safe-failure-v1/diagnostic.json"; then
                  if [ -n "${GITHUB_OUTPUT-}" ] && echo 'safe_diagnostic_owned=true' >> "$GITHUB_OUTPUT"; then :; fi
                fi
              fi
            fi
            exit "$native_status"
          }
          test ! -s "$RUNNER_TEMP/directory-transports-native.private.stderr"
          python3 -B scripts/governance/check_directory_transports_v1.py --receipt "$RUNNER_TEMP/directory-transports-v1/integration.json" --source-revision "$GITHUB_SHA" > "$RUNNER_TEMP/directory-transports-v1/accepted.pending.json"
          mv "$RUNNER_TEMP/directory-transports-v1/accepted.pending.json" "$RUNNER_TEMP/directory-transports-v1/accepted.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-directory-transports-v1-php-8.5.12
          path: ${{ runner.temp }}/directory-transports-v1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && steps.directory-sql.outputs.safe_diagnostic_owned == 'true'
        with:
          name: native-directory-safe-failure-v1
          path: ${{ runner.temp }}/directory-transports-safe-failure-v1/diagnostic.json
          if-no-files-found: error
