name: Publish Phorge container

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable source tag (YYYY.MM.DD-rN)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phorge-container-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - name: Verify release gate rejection paths
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Require exact tag identity and refuse immutable tag overwrite
        id: existing
        run: |
          python3 deploy/release/image_metadata.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --output "$RUNNER_TEMP/phorge-release-preflight.json" --github-output "$GITHUB_OUTPUT"
      - name: Read immutable build dependencies
        id: lock
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path('deploy/acceptance/build-lock.json').read_text())
          print('php=' + lock['images']['php'])
          print('apcu=' + lock['apcu'])
          print('apcu_sha256=' + lock['apcuSHA256'])
          print('snapshot=' + lock['debianSnapshot'])
          PY
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build the production AMD64 runtime before publication
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: phorge-security:publish-amd64
          build-args: |
            PHP_BASE_IMAGE=${{ steps.lock.outputs.php }}
            APCU_VERSION=${{ steps.lock.outputs.apcu }}
            APCU_SHA256=${{ steps.lock.outputs.apcu_sha256 }}
            DEBIAN_SNAPSHOT=${{ steps.lock.outputs.snapshot }}
          cache-from: type=gha,scope=phorge
          cache-to: type=gha,mode=max,scope=phorge
      - name: Check AMD64 effective runtime settings
        if: steps.existing.outputs.exists != 'true'
        run: docker run --rm --network none --platform linux/amd64 --entrypoint php phorge-security:publish-amd64 /opt/phorge/phorge/deploy/acceptance/php_security.php
      - name: Build the production ARM64 runtime before publication
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: phorge-security:publish-arm64
          build-args: |
            PHP_BASE_IMAGE=${{ steps.lock.outputs.php }}
            APCU_VERSION=${{ steps.lock.outputs.apcu }}
            APCU_SHA256=${{ steps.lock.outputs.apcu_sha256 }}
            DEBIAN_SNAPSHOT=${{ steps.lock.outputs.snapshot }}
          cache-from: type=gha,scope=phorge
          cache-to: type=gha,mode=max,scope=phorge
      - name: Check ARM64 effective runtime settings
        if: steps.existing.outputs.exists != 'true'
        run: docker run --rm --network none --platform linux/arm64 --entrypoint php phorge-security:publish-arm64 /opt/phorge/phorge/deploy/acceptance/php_security.php
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish new immutable version and source tags
        id: image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.release_tag }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            PHP_BASE_IMAGE=${{ steps.lock.outputs.php }}
            APCU_VERSION=${{ steps.lock.outputs.apcu }}
            APCU_SHA256=${{ steps.lock.outputs.apcu_sha256 }}
            DEBIAN_SNAPSHOT=${{ steps.lock.outputs.snapshot }}
          cache-from: type=gha,scope=phorge
          cache-to: type=gha,mode=max,scope=phorge
      - name: Verify published version, source, architectures and immutable digest
        id: verified
        run: |
          python3 deploy/release/image_metadata.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --require-published \
            --output "$RUNNER_TEMP/phorge-release.json" --github-output "$GITHUB_OUTPUT"
      - name: Bind the registry digest to this build or the unchanged prior publication
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          PRIOR_DIGEST: ${{ steps.existing.outputs.digest }}
          VERIFIED_DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          set -euo pipefail
          expected=${BUILT_DIGEST:-$PRIOR_DIGEST}
          [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$expected" = "$VERIFIED_DIGEST"
      - name: Check the exact published runtime on both architectures
        env:
          DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "ghcr.io/$GITHUB_REPOSITORY@$DIGEST"
            docker run --rm --network none --platform "linux/$arch" --entrypoint php \
              "ghcr.io/$GITHUB_REPOSITORY@$DIGEST" /opt/phorge/phorge/deploy/acceptance/php_security.php
          done
      - name: Attest the verified container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.verified.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the exact verified image digest
        env:
          DIGEST: ${{ steps.verified.outputs.digest }}
        run: cosign sign --yes "ghcr.io/$GITHUB_REPOSITORY@$DIGEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phorge-release-evidence
          path: ${{ runner.temp }}/phorge-release*.json
          if-no-files-found: error
