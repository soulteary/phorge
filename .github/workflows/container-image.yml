name: Publish Phorge container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: phorge-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Read immutable build dependencies
        id: lock
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path('deploy/acceptance/build-lock.json').read_text())
          print('php=' + lock['images']['php'])
          print('apcu=' + lock['apcu'])
          print('apcu_sha256=' + lock['apcuSHA256'])
          print('snapshot=' + lock['debianSnapshot'])
          PY
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Verify actual production image before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: phorge-security:publish
          build-args: |
            PHP_BASE_IMAGE=${{ steps.lock.outputs.php }}
            APCU_VERSION=${{ steps.lock.outputs.apcu }}
            APCU_SHA256=${{ steps.lock.outputs.apcu_sha256 }}
            DEBIAN_SNAPSHOT=${{ steps.lock.outputs.snapshot }}
          cache-from: type=gha,scope=phorge
          cache-to: type=gha,mode=max,scope=phorge
      - name: Check effective runtime settings
        run: docker run --rm --network none --entrypoint php phorge-security:publish /opt/phorge/phorge/deploy/acceptance/php_security.php
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable source-tagged multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PHP_BASE_IMAGE=${{ steps.lock.outputs.php }}
            APCU_VERSION=${{ steps.lock.outputs.apcu }}
            APCU_SHA256=${{ steps.lock.outputs.apcu_sha256 }}
            DEBIAN_SNAPSHOT=${{ steps.lock.outputs.snapshot }}
          cache-from: type=gha,scope=phorge
          cache-to: type=gha,mode=max,scope=phorge
