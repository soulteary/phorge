name: Gorge runtime contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gorge_ref:
        description: Immutable 40-character Gorge commit for all paired contracts
        required: false
        default: ''
      image_ref:
        description: Published Gorge image service reference for cross-repository contracts
        required: false
        default: ''
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gorge-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pgorge-contract-only" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl
          coverage: none
      - name: Configure disposable MySQL for historical migrations
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD=gorge-contract-only "$MYSQL_CONTAINER" \
            mysql --user=root --execute="SET GLOBAL sql_mode = 'STRICT_ALL_TABLES'"
      - name: Prepare parser tools for runtime maintenance contracts
        run: php scripts/runtime/build.php all
      - name: Verify bundled PHP runtime and retained behavior
        run: |
          php scripts/runtime/verify.php
          php tests/contract/worker/bundled_runtime.php
          php tests/contract/runtime/compatibility.php
          php tests/contract/runtime/diff.php
          php tests/contract/runtime/integrity.php
          php tests/contract/runtime/maintenance.php
      - name: Require immutable paired Gorge revision
        env:
          GORGE_REF: ${{ inputs.gorge_ref || vars.GORGE_CONTRACT_REF }}
        run: |
          if ! [[ "$GORGE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Set GORGE_CONTRACT_REF or gorge_ref to the published matching Gorge commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          repository: soulteary/gorge
          ref: ${{ inputs.gorge_ref || vars.GORGE_CONTRACT_REF }}
          path: .test-gorge
      - uses: actions/setup-go@v6
        with:
          go-version-file: .test-gorge/go/go.mod
          cache-dependency-path: .test-gorge/go/go.sum
      - name: Verify integration PHP transport and inbound receipts
        env:
          GORGE_TEST_INTEGRATIONS_MYSQL_PORT: '3306'
          GORGE_TEST_INTEGRATIONS_MYSQL_PASSWORD: gorge-contract-only
        run: |
          php tests/contract/integrations/runtime.php
          php tests/contract/integrations/inbound_mysql.php
      - name: Validate Docker delivery entry and manifest failure gates
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/contract/worker/delivery_manifest_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/contract/worker/delivery_entry_test.py
          python3 deploy/acceptance/accept.py --gorge-dir .test-gorge --check
      - name: Verify production Compose topology
        run: python3 tests/contract/worker/production_compose.py
      - name: Start mandatory current image and real S3 fixtures
        run: |
          docker build --build-arg SERVICE=gorge-image --build-arg PORT=8190 -t gorge-image:paired .test-gorge/go
          docker run -d --name paired-image -p 127.0.0.1:18196:8190 -e GORGE_SERVICE_TOKEN=acceptance-image-only gorge-image:paired
          docker build --build-arg SERVICE=gorge-render --build-arg PORT=8140 -t gorge-render:paired .test-gorge/go
          docker run -d --name paired-render -p 127.0.0.1:18140:8140 -e GORGE_SERVICE_TOKEN=acceptance-render-only gorge-render:paired
          docker run -d --name paired-s3 -p 127.0.0.1:19091:9000 -e OTTERIO_ROOT_USER=gorgeacceptance -e OTTERIO_ROOT_PASSWORD=gorge-acceptance-only ghcr.io/soulteary/otterio@sha256:9caee7b58a029ba7aa7556ea446184316585485b29c58e2889e07634c470b225 server /data --address :9000
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18196/readyz && curl -fsS http://127.0.0.1:18140/readyz && curl -fsS http://127.0.0.1:19091/otterio/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify retained products with the current render service
        env:
          GORGE_TEST_RENDER_URL: http://127.0.0.1:18140
          GORGE_TEST_RENDER_TOKEN: acceptance-render-only
        run: php tests/contract/runtime/products.php
      - name: Verify paired takeover, migration and recovery
        env:
          GORGE_TEST_GORGE_DIR: ${{ github.workspace }}/.test-gorge
          GORGE_TEST_MYSQL_PORT: '3306'
          GORGE_TEST_MYSQL_PASSWORD: gorge-contract-only
          GORGE_TEST_INTEGRATIONS_MYSQL_PORT: '3306'
          GORGE_TEST_INTEGRATIONS_MYSQL_PASSWORD: gorge-contract-only
          GORGE_TEST_S3_URL: http://127.0.0.1:19091
          GORGE_TEST_S3_USER: gorgeacceptance
          GORGE_TEST_S3_PASSWORD: gorge-acceptance-only
          GORGE_TEST_IMAGE_URL: http://127.0.0.1:18196
          GORGE_TEST_IMAGE_TOKEN: acceptance-image-only
          GORGE_TEST_ACCEPTANCE_MANIFEST: ${{ runner.temp }}/paired-acceptance.json
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/contract/worker/acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: paired-source-identities
          path: ${{ runner.temp }}/paired-acceptance.json
          if-no-files-found: error
      - name: Verify real backend concurrency and interruption
        working-directory: .test-gorge/go
        env:
          PHORGE_FORK_DIR: ${{ github.workspace }}
          GORGE_TEST_MYSQL_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/
          GORGE_TEST_REDIS_ADDR: 127.0.0.1:6379
          GORGE_TEST_SEARCH_MYSQL_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/
          GORGE_TEST_FILE_LIFECYCLE_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/gorge_lifecycle_test
          GORGE_TEST_INTEGRATIONS_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/gorge_integrations_test
        run: |
          php -r '$db=new mysqli("127.0.0.1","root","gorge-contract-only","",3306); foreach (["gorge_lifecycle_test","gorge_integrations_test"] as $name) { $db->query("CREATE DATABASE ".$name); }'
          go test -race -count=1 ./internal/taskqueue ./internal/filestorage ./internal/integrations ./internal/mailer ./internal/search/projection
      - name: Verify execution, provider retirement and feed transaction rollback
        env:
          GORGE_TEST_CLEANUP_EXPORT: ${{ runner.temp }}/cleanup-export.json
          GORGE_TEST_SEARCH_SCAN_PAGE: ${{ runner.temp }}/search-source-page.json
          GORGE_TEST_MYSQL_PORT: '3306'
          GORGE_TEST_MYSQL_PASSWORD: gorge-contract-only
        run: |
          php tests/contract/worker/cutover.php
          php tests/contract/worker/startup_http.php
          php tests/contract/worker/installation.php
          php tests/contract/download/runtime.php
          php tests/contract/cleanup/runtime.php
          php tests/contract/scheduler/runtime.php
          php tests/contract/worker/execution.php
          php tests/contract/worker/retirement.php
          php tests/contract/feed/outbox.php
          php tests/contract/mail/outbox.php
          php tests/contract/search/projection.php
          php tests/contract/search/outbox.php
          php tests/contract/search/deletion.php
          php tests/contract/search/source.php
      - name: Verify paired cleanup contracts
        working-directory: .test-gorge/go
        env:
          PHORGE_FORK_DIR: ${{ github.workspace }}
          GORGE_TEST_CLEANUP_EXPORT: ${{ runner.temp }}/cleanup-export.json
          GORGE_TEST_MYSQL_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/
        run: |
          test -s "$GORGE_TEST_CLEANUP_EXPORT"
          test -f internal/maintenance/cleanup/contract_test.go
          go test -race -count=1 ./internal/maintenance/... ./cmd/gorge-maintenance

      - name: Verify paired search source scan contracts
        working-directory: .test-gorge/go
        env:
          GORGE_TEST_SEARCH_SCAN_PAGE: ${{ runner.temp }}/search-source-page.json
          GORGE_TEST_SEARCH_MYSQL_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/
        run: |
          test -s "$GORGE_TEST_SEARCH_SCAN_PAGE"
          test -f internal/search/projection/source_scan_test.go
          go test -race -count=1 ./internal/search/... ./internal/platform/conduitclient ./internal/worker/handlers

  image-contracts:
    if: github.event_name == 'workflow_dispatch' && inputs.image_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, curl
          coverage: none
      - name: Prepare parser tools for runtime maintenance contracts
        run: php scripts/runtime/build.php all
      - name: Verify bundled PHP runtime and retained behavior
        run: |
          php scripts/runtime/verify.php
          php tests/contract/worker/bundled_runtime.php
          php tests/contract/runtime/compatibility.php
          php tests/contract/runtime/diff.php
          php tests/contract/runtime/integrity.php
          php tests/contract/runtime/maintenance.php
      - name: Require immutable paired Gorge revision
        env:
          GORGE_REF: ${{ inputs.gorge_ref || vars.GORGE_CONTRACT_REF }}
        run: |
          if ! [[ "$GORGE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Set GORGE_CONTRACT_REF or gorge_ref to the published matching Gorge commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          repository: soulteary/gorge
          ref: ${{ inputs.gorge_ref || vars.GORGE_CONTRACT_REF }}
          path: .test-gorge
      - name: Start current render service for retained products
        run: |
          docker build --build-arg SERVICE=gorge-render --build-arg PORT=8140 -t gorge-render:products .test-gorge/go
          docker run -d --name image-runtime-render -p 127.0.0.1:18140:8140 -e GORGE_SERVICE_TOKEN=acceptance-render-only gorge-render:products
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18140/readyz && exit 0; sleep 1; done
          docker logs image-runtime-render
          exit 1
      - name: Verify retained products with the current render service
        env:
          GORGE_TEST_RENDER_URL: http://127.0.0.1:18140
          GORGE_TEST_RENDER_TOKEN: acceptance-render-only
        run: php tests/contract/runtime/products.php
      - name: Start published image service
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          docker run -d --name image-contract -p 18150:8190 -e GORGE_SERVICE_TOKEN=image-contract-only --memory=2g --read-only --tmpfs /tmp:rw,size=512m "$IMAGE_REF"
          for i in $(seq 1 30); do curl -fsS http://localhost:18150/readyz && exit 0; sleep 1; done
          docker logs image-contract
          exit 1
      - name: PHP image contract
        env:
          GORGE_TEST_IMAGE_URL: http://127.0.0.1:18150
          GORGE_TEST_IMAGE_TOKEN: image-contract-only
        run: php tests/contract/image/runtime.php
      - name: Remove test service
        if: always()
        run: docker rm -f image-contract image-runtime-render || true
