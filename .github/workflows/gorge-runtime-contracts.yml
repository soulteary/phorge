name: Gorge runtime contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Published Gorge image service reference for cross-repository contracts
        required: false
        default: ''
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gorge-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pgorge-contract-only" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
      - uses: actions/checkout@v6
        with:
          repository: phorgeit/arcanist
          ref: 6f3726694752fb9cb08207070a4d7f68163784e1
          path: .test-arcanist
      - name: Verify execution, provider retirement and feed transaction rollback
        env:
          GORGE_TEST_ARCANIST_DIR: ${{ github.workspace }}/.test-arcanist
          GORGE_TEST_MYSQL_PORT: '3306'
          GORGE_TEST_MYSQL_PASSWORD: gorge-contract-only
        run: |
          php tests/contract/worker/execution.php
          php tests/contract/worker/retirement.php
          php tests/contract/feed/outbox.php
          php tests/contract/mail/outbox.php
          php tests/contract/search/projection.php
          php tests/contract/search/outbox.php

  image-contracts:
    if: github.event_name == 'workflow_dispatch' && inputs.image_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd
          coverage: none
      - uses: actions/checkout@v6
        with:
          repository: phorgeit/arcanist
          ref: 6f3726694752fb9cb08207070a4d7f68163784e1
          path: .test-arcanist
      - name: Start published image service
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          docker run -d --name image-contract -p 18150:8190 -e GORGE_SERVICE_TOKEN=image-contract-only --memory=2g --read-only --tmpfs /tmp:rw,size=512m "$IMAGE_REF"
          for i in $(seq 1 30); do curl -fsS http://localhost:18150/readyz && exit 0; sleep 1; done
          docker logs image-contract
          exit 1
      - name: PHP image contract
        env:
          GORGE_TEST_ARCANIST_DIR: ${{ github.workspace }}/.test-arcanist
          GORGE_TEST_IMAGE_URL: http://127.0.0.1:18150
          GORGE_TEST_IMAGE_TOKEN: image-contract-only
        run: php tests/contract/image/runtime.php
      - name: Remove test service
        if: always()
        run: docker rm -f image-contract || true
