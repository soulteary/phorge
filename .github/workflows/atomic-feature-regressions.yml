name: Atomic feature regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packages:
    name: Native packages (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.12']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atomic-regressions-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -patomic-regressions-only" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      ATOMIC_TEST_DISPOSABLE: '1'
      GORGE_TEST_MYSQL_PORT: '3306'
      GORGE_TEST_MYSQL_PASSWORD: atomic-regressions-only
      GORGE_TEST_FILE_URL: http://127.0.0.1:18100
      GORGE_TEST_FILE_TOKEN: atomic-file-only
      GORGE_TEST_IMAGE_URL: http://127.0.0.1:18190
      GORGE_TEST_IMAGE_TOKEN: a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3
      GORGE_TEST_RENDER_URL: http://127.0.0.1:18140
      GORGE_TEST_RENDER_TOKEN: atomic-render-only
      GORGE_TEST_SEARCH_URL: http://127.0.0.1:18120
      GORGE_TEST_SEARCH_TOKEN: atomic-search-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: mysqli, mbstring, curl, gd, zip, dom, xmlreader, xmlwriter
          tools: composer:2.11.1
          coverage: none
      - name: Install the retained product-boundary checker dependency
        timeout-minutes: 5
        run: |
          umask 077
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rg_root=$(mktemp -d "$RUNNER_TEMP/atomic-rg.XXXXXX")
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 45 --retry 1 --retry-delay 1 --retry-max-time 95 \
            --max-filesize 2566310 --output "$rg_root/archive.tar.gz" \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
          python3 - "$rg_root" <<'PYRG'
          import hashlib, io, os, stat, subprocess, sys, tarfile
          from pathlib import Path
          ARCHIVE_SIZE=2566310
          ARCHIVE_SHA256='4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e'
          MEMBER='ripgrep-14.1.1-x86_64-unknown-linux-musl/rg'
          BINARY_SIZE=6597984
          BINARY_SHA256='f401154e2393f9002ac77e419f9ee5521c18f4f8cd3e32293972f493ba06fce7'
          def need(value):
              if not value:
                  raise ValueError('Pinned ripgrep preparation refused')
          def identity_stamp(info):
              return (info.st_dev,info.st_ino,info.st_mode,info.st_nlink,info.st_uid,info.st_gid,info.st_size,info.st_mtime_ns,info.st_ctime_ns)
          def install(root):
              root=Path(root)
              info=root.lstat()
              need(root.is_absolute() and root.resolve(strict=True)==root and stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode)==0o700 and info.st_uid==os.getuid())
              path=root/'archive.tar.gz'
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  before=os.fstat(fd)
                  need(stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_uid==os.getuid() and before.st_size==ARCHIVE_SIZE)
                  chunks=[];count=0
                  while count<=ARCHIVE_SIZE:
                      chunk=os.read(fd,min(65536,ARCHIVE_SIZE+1-count))
                      if not chunk:
                          break
                      chunks.append(chunk);count+=len(chunk)
                  raw=b''.join(chunks)
                  after=os.fstat(fd)
                  need(identity_stamp(before)==identity_stamp(after)==identity_stamp(path.lstat()) and len(raw)==ARCHIVE_SIZE and hashlib.sha256(raw).hexdigest()==ARCHIVE_SHA256)
              finally:
                  os.close(fd)
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
                  members=archive.getmembers()
                  need(len(members)<=64)
                  prefix=MEMBER.split('/')[0]
                  for item in members:
                      parts=item.name.split('/')
                      need(all(part not in ('','.','..') for part in parts) and parts[0]==prefix and (item.isfile() or item.isdir()) and item.linkname=='')
                  matches=[item for item in members if item.name==MEMBER]
                  need(len(matches)==1)
                  member=matches[0]
                  need(member.isfile() and member.linkname=='' and member.size==BINARY_SIZE and member.mode==0o755)
                  with archive.extractfile(member) as stream:
                      binary=stream.read(BINARY_SIZE+1)
                  need(len(binary)==BINARY_SIZE and hashlib.sha256(binary).hexdigest()==BINARY_SHA256)
              folder=root/'bin';folder.mkdir(mode=0o700)
              target=folder/'rg'
              fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o700)
              try:
                  offset=0
                  while offset<len(binary):
                      count=os.write(fd,binary[offset:offset+65536]);need(count>0);offset+=count
                  os.fsync(fd)
                  need(os.fstat(fd).st_size==BINARY_SIZE and identity_stamp(target.lstat())==identity_stamp(os.fstat(fd)))
              finally:
                  os.close(fd)
              return target
          def probe(target):
              version=subprocess.run([str(target),'--version'],capture_output=True,text=True,timeout=5)
              need(version.returncode==0 and version.stdout.splitlines()[0]=='ripgrep 14.1.1 (rev 4649aa9700)')
              root=target.parent.parent/'probe';root.mkdir(mode=0o700)
              for folder in ('src','scripts','bin','webroot','resources'):
                  (root/folder).mkdir(mode=0o700)
              (root/'patterns').write_text('RetiredClass[A-Za-z]*\n')
              (root/'src/.hidden.php').write_text('RetiredClassOne RetiredClassTwo\n')
              (root/'src/excluded.php').write_text('RetiredClassIgnored\n')
              args=[str(target),'--line-number','--no-heading','--color','never','--hidden','--only-matching','--glob','!src/excluded.php','-f','patterns','src','scripts','bin','webroot','resources']
              found=subprocess.run(args,cwd=root,capture_output=True,text=True,timeout=5)
              need(found.returncode==0 and found.stdout=='src/.hidden.php:1:RetiredClassOne\nsrc/.hidden.php:1:RetiredClassTwo\n' and found.stderr=='')
              (root/'patterns').write_text('NoSuchRetiredClass\n')
              missing=subprocess.run(args,cwd=root,capture_output=True,text=True,timeout=5)
              need(missing.returncode==1 and missing.stdout=='' and missing.stderr=='')
          target=install(Path(sys.argv[1]))
          probe(target)
          PYRG
          printf '%s\n' "$rg_root/bin" >> "$GITHUB_PATH"
      - name: Check runner failure and isolation policy
        run: |
          php tests/atomic/test_gate.php
          php tests/atomic/test_timeout.php
          python3 -m unittest discover -s tests/atomic -p 'test_*.py' -v
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Verify daemon role stop signal in network-isolated containers
        run: python3 tests/atomic/daemon_shutdown.py --output "$RUNNER_TEMP/daemon-shutdown.json"
      - name: Verify read-only permission difference audits on restored snapshots
        run: |
          python3 -m unittest discover -s tests/permissions -p 'test_*.py' -v
          php tests/permissions/restore_integration.php
          python3 scripts/permissions/inventory.py --require-clean --output "$RUNNER_TEMP/permission-consumers.json"
      - name: Require the same immutable Gorge revision as paired runtime contracts
        run: |
          revision=$(python3 tests/atomic/check_pair.py --print-revision)
          echo "GORGE_CONTRACT_REF=$revision" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          repository: soulteary/gorge
          ref: ${{ env.GORGE_CONTRACT_REF }}
          path: .test-gorge
          persist-credentials: false
      - name: Move the owned paired checkout outside the Phorge source worktree
        run: |
          fixture_root=$(mktemp -d "$RUNNER_TEMP/atomic-gorge.XXXXXX")
          mv -- .test-gorge "$fixture_root/source"
          echo "ATOMIC_GORGE_SOURCE=$fixture_root/source" >> "$GITHUB_ENV"
      - name: Build actual file, image, render and search services from the paired source
        run: python3 tests/atomic/build_gorge.py --gorge-dir "$ATOMIC_GORGE_SOURCE" --revision "$GORGE_CONTRACT_REF"
      - name: Start isolated disposable dependencies
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD=atomic-regressions-only "$MYSQL_CONTAINER" mysql --user=root --execute="SET GLOBAL sql_mode = 'STRICT_ALL_TABLES'"
          docker network create atomic-fixtures
          docker run -d --name atomic-file --network atomic-fixtures -p 127.0.0.1:18100:8100 --read-only --tmpfs /var/lib/gorge/files:rw,uid=10001,gid=10001,mode=0700 --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-file-only -e GORGE_FILE_LOCAL_DISK_PATH=/var/lib/gorge/files gorge-file-storage:atomic
          docker run -d --name atomic-image --network atomic-fixtures -p 127.0.0.1:18190:8190 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN="$GORGE_TEST_IMAGE_TOKEN" gorge-image:atomic
          docker run -d --name atomic-render --network atomic-fixtures -p 127.0.0.1:18140:8140 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-render-only gorge-render:atomic
          meili_image=$(python3 -c 'import json; print(json.load(open("deploy/acceptance/build-lock.json"))["images"]["meilisearch"])')
          docker run -d --name atomic-meili --network atomic-fixtures --tmpfs /meili_data:rw -e MEILI_MASTER_KEY=atomic-search-fixture-secret-only -e MEILI_ENV=production -e MEILI_NO_ANALYTICS=true "$meili_image"
          docker run -d --name atomic-search --network atomic-fixtures -p 127.0.0.1:18120:8120 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-search-only -e GORGE_SEARCH_ENGINE=meilisearch -e MEILI_HOST=atomic-meili:7700 -e MEILI_MASTER_KEY=atomic-search-fixture-secret-only -e MEILI_INDEX=atomic_permission_routes gorge-search:atomic
          python3 - <<'PY'
          import time, urllib.request
          for port in (18100, 18190, 18140, 18120):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=2) as response:
                          if response.status == 200:
                              break
                  except OSError:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit(f'Disposable service on port {port} did not become ready.')
          PY
      - name: Prepare bounded metadata-only source footprint diagnostics
        id: atomic-footprint
        run: |
          python3 - <<'PYFOOTPRINT'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'atomic-footprint'
          root.mkdir(mode=0o700)
          (root / 'records').mkdir(mode=0o700)
          script = "import json, os, stat, subprocess, sys\nfrom pathlib import Path\nSTAGES = {'before_build','after_build','after_maps','after_verify','before_governance','after_governance'}\ndef need(ok):\n    if not ok: raise ValueError('footprint_contract_refused')\ndef safe_name(name):\n    need(type(name) is str and 0 < len(name) <= 1024 and not name.startswith('/') and all(x not in ('', '.', '..') for x in name.split('/')) and all(ord(c) >= 32 and ord(c) != 127 for c in name))\n    return name\ndef collect(root):\n    rows=[]\n    flags=os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC\n    fd=os.open(root,flags)\n    def walk(parent,prefix):\n        for name in sorted(os.listdir(parent)):\n            if not prefix and name=='.git': continue\n            rel=safe_name(prefix+name)\n            st=os.stat(name,dir_fd=parent,follow_symlinks=False)\n            kind='directory' if stat.S_ISDIR(st.st_mode) else 'regular' if stat.S_ISREG(st.st_mode) else 'symlink' if stat.S_ISLNK(st.st_mode) else 'other'\n            rows.append({'path':rel,'type':kind,'mode':format(stat.S_IMODE(st.st_mode),'04o'),'size':st.st_size})\n            need(len(rows)<=20000 and type(st.st_size) is int and st.st_size>=0)\n            if kind=='directory':\n                child=os.open(name,flags,dir_fd=parent)\n                try:\n                    current=os.fstat(child)\n                    need((current.st_dev,current.st_ino)==(st.st_dev,st.st_ino))\n                    walk(child,rel+'/')\n                finally: os.close(child)\n    try: walk(fd,'')\n    finally: os.close(fd)\n    return rows\ndef expected(root):\n    env={'PATH':os.defpath,'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':os.devnull,'GIT_NO_REPLACE_OBJECTS':'1'}\n    raw=subprocess.run(['git','--no-replace-objects','-C',str(root),'-c','core.hooksPath=/dev/null','ls-tree','-rz','--name-only','HEAD'],env=env,check=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=30).stdout\n    need(len(raw)<=8*1024*1024 and raw.endswith(b'\\0'))\n    names=[safe_name(n.decode('utf-8','strict')) for n in raw[:-1].split(b'\\0')]\n    need(len(names)<=20000 and len(names)==len(set(names)))\n    return set(names)\ndef write_output(directory,stage,data):\n    flags=os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC\n    parent=os.open(directory,flags)\n    try:\n        st=os.fstat(parent);need(st.st_uid==os.getuid() and stat.S_IMODE(st.st_mode)==0o700)\n        raw=(json.dumps(data,sort_keys=True,separators=(',',':'))+'\\n').encode()\n        need(len(raw)<=16*1024*1024)\n        fd=os.open(stage+'.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600,dir_fd=parent)\n        try:\n            os.fchmod(fd,0o600)\n            view=memoryview(raw)\n            while view:\n                written=os.write(fd,view);need(written>0);view=view[written:]\n            os.fsync(fd)\n            done=os.fstat(fd);need(stat.S_ISREG(done.st_mode) and done.st_nlink==1 and stat.S_IMODE(done.st_mode)==0o600)\n        finally: os.close(fd)\n        final=os.stat(directory,follow_symlinks=False)\n        need((st.st_dev,st.st_ino)==(final.st_dev,final.st_ino))\n    finally:os.close(parent)\ndef main():\n    need(len(sys.argv)==2 and sys.argv[1] in STAGES)\n    stage=sys.argv[1];root=Path.cwd();rows=collect(root);names=expected(root)\n    leaves={x['path'] for x in rows if x['type']!='directory'}\n    extra=sorted(leaves-names);missing=sorted(names-leaves)\n    need(len(extra)<=4000 and len(missing)<=4000)\n    write_output(Path(os.environ['RUNNER_TEMP'])/'atomic-footprint'/'records',stage,{'schema':1,'stage':stage,'truncated':False,'rows':rows,'extra_names':extra,'missing_names':missing})\nif __name__=='__main__':\n    try:main()\n    except Exception:\n        print('atomic_footprint_diagnostic_refused',file=sys.stderr)\n        raise SystemExit(1)\n"
          fd = os.open(root / 'collector.py', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          try:
              with os.fdopen(fd, 'w') as stream:
                  stream.write(script)
          except BaseException:
              raise
          PYFOOTPRINT
      - name: Prepare retained parsers and verify deterministic maps and product cuts
        run: |
          python3 "$RUNNER_TEMP/atomic-footprint/collector.py" before_build
          php scripts/runtime/build.php all
          python3 "$RUNNER_TEMP/atomic-footprint/collector.py" after_build
          php bin/rebuild-library-map
          git diff --exit-code -- src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json
          sha256sum src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json > /tmp/atomic-maps.sha256
          php bin/rebuild-library-map
          sha256sum --check /tmp/atomic-maps.sha256
          python3 "$RUNNER_TEMP/atomic-footprint/collector.py" after_maps
          php scripts/runtime/verify.php
          bash .github/scripts/check-retired-app-references.sh
          python3 "$RUNNER_TEMP/atomic-footprint/collector.py" after_verify
      - name: Upload successful parser preparation source footprints early
        uses: actions/upload-artifact@v4
        with:
          name: atomic-prepared-pre-footprint-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/atomic-footprint/records/before_build.json
            ${{ runner.temp }}/atomic-footprint/records/after_build.json
            ${{ runner.temp }}/atomic-footprint/records/after_maps.json
            ${{ runner.temp }}/atomic-footprint/records/after_verify.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify inactive governance foundations in isolated fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-1"
          python3 scripts/governance/check_contracts.py > "$RUNNER_TEMP/governance-batch-1/contracts.json"
          python3 "$RUNNER_TEMP/atomic-footprint/collector.py" before_governance
          python3 -m unittest discover -s tests/governance -p 'test_*.py' -v
          php tests/governance/run.php > "$RUNNER_TEMP/governance-batch-1/native.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-directory-mysql.php > "$RUNNER_TEMP/governance-batch-1/directory.json"
      - name: Capture source footprint after governance even on failure
        if: ${{ always() && steps.atomic-footprint.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/atomic-footprint/collector.py" after_governance
      - name: Upload metadata-only source footprint diagnostics
        if: ${{ always() && steps.atomic-footprint.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: atomic-source-footprint-php-${{ matrix.php }}
          path: ${{ runner.temp }}/atomic-footprint/records/*.json
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-1-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-1
          if-no-files-found: error
      - name: Verify extended caller inventory and isolated authorization read sets
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-2"
          python3 scripts/governance/check_callers.py > "$RUNNER_TEMP/governance-batch-2/callers.json"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-2/native.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-readset-mysql.php > "$RUNNER_TEMP/governance-batch-2/readset.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-2-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-2
          if-no-files-found: error
      - name: Verify bounded native governance sources in read-only snapshots
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-3"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-3/native.json"
          cp "$RUNNER_TEMP/governance-batch-2/callers.json" "$RUNNER_TEMP/governance-batch-3/callers.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-native-source-mysql.php > "$RUNNER_TEMP/governance-batch-3/native-source.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-3-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-3
          if-no-files-found: error
      - name: Verify native governance expansion branches and rule hierarchy observations
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-4"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-4/native.json"
          cp "$RUNNER_TEMP/governance-batch-2/callers.json" "$RUNNER_TEMP/governance-batch-4/callers.json"
          cp "$RUNNER_TEMP/governance-batch-3/native-source.json" "$RUNNER_TEMP/governance-batch-4/native-source.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-native-rule-branches-mysql.php > "$RUNNER_TEMP/governance-batch-4/native-rule-branches.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-4-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-4
          if-no-files-found: error
      - name: Verify native governance pipeline boundaries and policy composition
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-5"
          python3 scripts/governance/check_pipeline_boundaries.py > "$RUNNER_TEMP/governance-batch-5/pipeline-boundaries.json"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-5/native.json"
          cp "$RUNNER_TEMP/governance-batch-2/callers.json" "$RUNNER_TEMP/governance-batch-5/callers.json"
          cp "$RUNNER_TEMP/governance-batch-3/native-source.json" "$RUNNER_TEMP/governance-batch-5/native-source.json"
          cp "$RUNNER_TEMP/governance-batch-4/native-rule-branches.json" "$RUNNER_TEMP/governance-batch-5/native-rule-branches.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-native-pipeline-composition-mysql.php > "$RUNNER_TEMP/governance-batch-5/native-pipeline-composition.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
