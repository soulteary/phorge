name: Atomic feature regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packages:
    name: Native packages (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.12']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atomic-regressions-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -patomic-regressions-only" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      GORGE_CONTRACT_REF: ${{ vars.GORGE_CONTRACT_REF }}
      ATOMIC_TEST_DISPOSABLE: '1'
      GORGE_TEST_MYSQL_PORT: '3306'
      GORGE_TEST_MYSQL_PASSWORD: atomic-regressions-only
      GORGE_TEST_FILE_URL: http://127.0.0.1:18100
      GORGE_TEST_FILE_TOKEN: atomic-file-only
      GORGE_TEST_IMAGE_URL: http://127.0.0.1:18190
      GORGE_TEST_IMAGE_TOKEN: atomic-image-only
      GORGE_TEST_RENDER_URL: http://127.0.0.1:18140
      GORGE_TEST_RENDER_TOKEN: atomic-render-only
      GORGE_TEST_SEARCH_URL: http://127.0.0.1:18120
      GORGE_TEST_SEARCH_TOKEN: atomic-search-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: mysqli, mbstring, curl, gd
          coverage: none
      - name: Install the retained product-boundary checker dependency
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y ripgrep
          rg --version
      - name: Check runner failure and isolation policy
        run: |
          php tests/atomic/test_gate.php
          php tests/atomic/test_timeout.php
          python3 -m unittest discover -s tests/atomic -p 'test_*.py' -v
      - name: Verify read-only permission difference audits on restored snapshots
        run: |
          python3 -m unittest discover -s tests/permissions -p 'test_*.py' -v
          php tests/permissions/restore_integration.php
          python3 scripts/permissions/inventory.py --require-clean --output "$RUNNER_TEMP/permission-consumers.json"
      - name: Require the same immutable Gorge revision as paired runtime contracts
        run: |
          python3 tests/atomic/check_pair.py
      - uses: actions/checkout@v6
        with:
          repository: soulteary/gorge
          ref: ${{ env.GORGE_CONTRACT_REF }}
          path: .test-gorge
          persist-credentials: false
      - name: Move the owned paired checkout outside the Phorge source worktree
        run: |
          fixture_root=$(mktemp -d "$RUNNER_TEMP/atomic-gorge.XXXXXX")
          mv -- .test-gorge "$fixture_root/source"
          echo "ATOMIC_GORGE_SOURCE=$fixture_root/source" >> "$GITHUB_ENV"
      - name: Build actual file, image, render and search services from the paired source
        run: python3 tests/atomic/build_gorge.py --gorge-dir "$ATOMIC_GORGE_SOURCE" --revision "$GORGE_CONTRACT_REF"
      - name: Start isolated disposable dependencies
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD=atomic-regressions-only "$MYSQL_CONTAINER" mysql --user=root --execute="SET GLOBAL sql_mode = 'STRICT_ALL_TABLES'"
          docker network create atomic-fixtures
          docker run -d --name atomic-file --network atomic-fixtures -p 127.0.0.1:18100:8100 --read-only --tmpfs /var/lib/gorge/files:rw,uid=10001,gid=10001,mode=0700 --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-file-only -e GORGE_FILE_LOCAL_DISK_PATH=/var/lib/gorge/files gorge-file-storage:atomic
          docker run -d --name atomic-image --network atomic-fixtures -p 127.0.0.1:18190:8190 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-image-only gorge-image:atomic
          docker run -d --name atomic-render --network atomic-fixtures -p 127.0.0.1:18140:8140 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-render-only gorge-render:atomic
          meili_image=$(python3 -c 'import json; print(json.load(open("deploy/acceptance/build-lock.json"))["images"]["meilisearch"])')
          docker run -d --name atomic-meili --network atomic-fixtures --tmpfs /meili_data:rw -e MEILI_MASTER_KEY=atomic-search-fixture-secret-only -e MEILI_ENV=production -e MEILI_NO_ANALYTICS=true "$meili_image"
          docker run -d --name atomic-search --network atomic-fixtures -p 127.0.0.1:18120:8120 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-search-only -e GORGE_SEARCH_ENGINE=meilisearch -e MEILI_HOST=atomic-meili:7700 -e MEILI_MASTER_KEY=atomic-search-fixture-secret-only -e MEILI_INDEX=atomic_permission_routes gorge-search:atomic
          python3 - <<'PY'
          import time, urllib.request
          for port in (18100, 18190, 18140, 18120):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=2) as response:
                          if response.status == 200:
                              break
                  except OSError:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit(f'Disposable service on port {port} did not become ready.')
          PY
      - name: Prepare retained parsers and verify deterministic maps and product cuts
        run: |
          php scripts/runtime/build.php all
          php bin/rebuild-library-map
          git diff --exit-code -- src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json
          sha256sum src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json > /tmp/atomic-maps.sha256
          php bin/rebuild-library-map
          sha256sum --check /tmp/atomic-maps.sha256
          php scripts/runtime/verify.php
          bash .github/scripts/check-retired-app-references.sh
      - name: Run every registered native package with mandatory dependency preflight
        run: python3 tests/atomic/run.py --require-clean-worktree --output "$RUNNER_TEMP/atomic-evidence"
      - name: Verify functional PHP server runtime without storage
        if: ${{ hashFiles('tests/atomic/packages/D06.json') != '' }}
        run: python3 -m unittest discover -s tests/project-workspace -p 'test_*.py' -v
      - name: Verify native workspace HTTP and persistence contracts when installed
        if: ${{ hashFiles('tests/atomic/packages/D06.json') != '' }}
        run: python3 tests/project-workspace/serve.py --require-clean-worktree --exit-after-http --output "$RUNNER_TEMP/workspace-http-evidence"
      - name: Verify native permission routes on an enriched restored snapshot
        run: python3 tests/permissions/routes.py --require-clean-worktree --output "$RUNNER_TEMP/permission-route-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-routes-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/permission-route-evidence/route-results.json
            ${{ runner.temp }}/permission-consumers.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tests/atomic/packages/D06.json') != ''
        with:
          name: atomic-workspace-http-php-${{ matrix.php }}
          path: ${{ runner.temp }}/workspace-http-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-native-php-${{ matrix.php }}
          path: ${{ runner.temp }}/atomic-evidence
          if-no-files-found: warn
      - name: Remove only this job's disposable services
        if: always()
        run: |
          docker rm -f atomic-file atomic-image atomic-render atomic-search atomic-meili || true
          docker network rm atomic-fixtures || true
