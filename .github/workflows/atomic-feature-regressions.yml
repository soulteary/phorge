name: Atomic feature regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packages:
    name: Native packages (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.12']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atomic-regressions-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -patomic-regressions-only" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      GORGE_CONTRACT_REF: ${{ vars.GORGE_CONTRACT_REF }}
      ATOMIC_TEST_DISPOSABLE: '1'
      GORGE_TEST_MYSQL_PORT: '3306'
      GORGE_TEST_MYSQL_PASSWORD: atomic-regressions-only
      GORGE_TEST_FILE_URL: http://127.0.0.1:18100
      GORGE_TEST_FILE_TOKEN: atomic-file-only
      GORGE_TEST_IMAGE_URL: http://127.0.0.1:18190
      GORGE_TEST_IMAGE_TOKEN: a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3a3
      GORGE_TEST_RENDER_URL: http://127.0.0.1:18140
      GORGE_TEST_RENDER_TOKEN: atomic-render-only
      GORGE_TEST_SEARCH_URL: http://127.0.0.1:18120
      GORGE_TEST_SEARCH_TOKEN: atomic-search-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: mysqli, mbstring, curl, gd, zip, dom, xmlreader, xmlwriter
          tools: composer:2.11.1
          coverage: none
      - name: Install the retained product-boundary checker dependency
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y ripgrep
          rg --version
      - name: Check runner failure and isolation policy
        run: |
          php tests/atomic/test_gate.php
          php tests/atomic/test_timeout.php
          python3 -m unittest discover -s tests/atomic -p 'test_*.py' -v
          python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Verify daemon role stop signal in network-isolated containers
        run: python3 tests/atomic/daemon_shutdown.py --output "$RUNNER_TEMP/daemon-shutdown.json"
      - name: Verify read-only permission difference audits on restored snapshots
        run: |
          python3 -m unittest discover -s tests/permissions -p 'test_*.py' -v
          php tests/permissions/restore_integration.php
          python3 scripts/permissions/inventory.py --require-clean --output "$RUNNER_TEMP/permission-consumers.json"
      - name: Require the same immutable Gorge revision as paired runtime contracts
        run: |
          python3 tests/atomic/check_pair.py
      - uses: actions/checkout@v6
        with:
          repository: soulteary/gorge
          ref: ${{ env.GORGE_CONTRACT_REF }}
          path: .test-gorge
          persist-credentials: false
      - name: Move the owned paired checkout outside the Phorge source worktree
        run: |
          fixture_root=$(mktemp -d "$RUNNER_TEMP/atomic-gorge.XXXXXX")
          mv -- .test-gorge "$fixture_root/source"
          echo "ATOMIC_GORGE_SOURCE=$fixture_root/source" >> "$GITHUB_ENV"
      - name: Build actual file, image, render and search services from the paired source
        run: python3 tests/atomic/build_gorge.py --gorge-dir "$ATOMIC_GORGE_SOURCE" --revision "$GORGE_CONTRACT_REF"
      - name: Start isolated disposable dependencies
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD=atomic-regressions-only "$MYSQL_CONTAINER" mysql --user=root --execute="SET GLOBAL sql_mode = 'STRICT_ALL_TABLES'"
          docker network create atomic-fixtures
          docker run -d --name atomic-file --network atomic-fixtures -p 127.0.0.1:18100:8100 --read-only --tmpfs /var/lib/gorge/files:rw,uid=10001,gid=10001,mode=0700 --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-file-only -e GORGE_FILE_LOCAL_DISK_PATH=/var/lib/gorge/files gorge-file-storage:atomic
          docker run -d --name atomic-image --network atomic-fixtures -p 127.0.0.1:18190:8190 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN="$GORGE_TEST_IMAGE_TOKEN" gorge-image:atomic
          docker run -d --name atomic-render --network atomic-fixtures -p 127.0.0.1:18140:8140 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-render-only gorge-render:atomic
          meili_image=$(python3 -c 'import json; print(json.load(open("deploy/acceptance/build-lock.json"))["images"]["meilisearch"])')
          docker run -d --name atomic-meili --network atomic-fixtures --tmpfs /meili_data:rw -e MEILI_MASTER_KEY=atomic-search-fixture-secret-only -e MEILI_ENV=production -e MEILI_NO_ANALYTICS=true "$meili_image"
          docker run -d --name atomic-search --network atomic-fixtures -p 127.0.0.1:18120:8120 --read-only --tmpfs /tmp:rw -e GORGE_SERVICE_TOKEN=atomic-search-only -e GORGE_SEARCH_ENGINE=meilisearch -e MEILI_HOST=atomic-meili:7700 -e MEILI_MASTER_KEY=atomic-search-fixture-secret-only -e MEILI_INDEX=atomic_permission_routes gorge-search:atomic
          python3 - <<'PY'
          import time, urllib.request
          for port in (18100, 18190, 18140, 18120):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=2) as response:
                          if response.status == 200:
                              break
                  except OSError:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit(f'Disposable service on port {port} did not become ready.')
          PY
      - name: Prepare retained parsers and verify deterministic maps and product cuts
        run: |
          php scripts/runtime/build.php all
          php bin/rebuild-library-map
          git diff --exit-code -- src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json
          sha256sum src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json > /tmp/atomic-maps.sha256
          php bin/rebuild-library-map
          sha256sum --check /tmp/atomic-maps.sha256
          php scripts/runtime/verify.php
          bash .github/scripts/check-retired-app-references.sh
      - name: Verify inactive governance foundations in isolated fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-1"
          python3 scripts/governance/check_contracts.py > "$RUNNER_TEMP/governance-batch-1/contracts.json"
          python3 -m unittest discover -s tests/governance -p 'test_*.py' -v
          php tests/governance/run.php > "$RUNNER_TEMP/governance-batch-1/native.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-directory-mysql.php > "$RUNNER_TEMP/governance-batch-1/directory.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-1-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-1
          if-no-files-found: error
      - name: Verify extended caller inventory and isolated authorization read sets
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-2"
          python3 scripts/governance/check_callers.py > "$RUNNER_TEMP/governance-batch-2/callers.json"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-2/native.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-readset-mysql.php > "$RUNNER_TEMP/governance-batch-2/readset.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-2-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-2
          if-no-files-found: error
      - name: Verify bounded native governance sources in read-only snapshots
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-3"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-3/native.json"
          cp "$RUNNER_TEMP/governance-batch-2/callers.json" "$RUNNER_TEMP/governance-batch-3/callers.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-native-source-mysql.php > "$RUNNER_TEMP/governance-batch-3/native-source.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-3-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-3
          if-no-files-found: error
      - name: Verify native governance expansion branches and rule hierarchy observations
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-4"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-4/native.json"
          cp "$RUNNER_TEMP/governance-batch-2/callers.json" "$RUNNER_TEMP/governance-batch-4/callers.json"
          cp "$RUNNER_TEMP/governance-batch-3/native-source.json" "$RUNNER_TEMP/governance-batch-4/native-source.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-native-rule-branches-mysql.php > "$RUNNER_TEMP/governance-batch-4/native-rule-branches.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-4-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-4
          if-no-files-found: error
      - name: Verify native governance pipeline boundaries and policy composition
        run: |
          mkdir -p "$RUNNER_TEMP/governance-batch-5"
          python3 scripts/governance/check_pipeline_boundaries.py > "$RUNNER_TEMP/governance-batch-5/pipeline-boundaries.json"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-batch-5/native.json"
          cp "$RUNNER_TEMP/governance-batch-2/callers.json" "$RUNNER_TEMP/governance-batch-5/callers.json"
          cp "$RUNNER_TEMP/governance-batch-3/native-source.json" "$RUNNER_TEMP/governance-batch-5/native-source.json"
          cp "$RUNNER_TEMP/governance-batch-4/native-rule-branches.json" "$RUNNER_TEMP/governance-batch-5/native-rule-branches.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/fixtures/test-native-pipeline-composition-mysql.php > "$RUNNER_TEMP/governance-batch-5/native-pipeline-composition.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-batch-5-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-batch-5
          if-no-files-found: error
      - name: Run every registered native package with mandatory dependency preflight
        run: python3 tests/atomic/run.py --require-clean-worktree --output "$RUNNER_TEMP/atomic-evidence"
      - name: Verify functional PHP server runtime without storage
        if: ${{ hashFiles('tests/atomic/packages/D06.json') != '' }}
        run: python3 -m unittest discover -s tests/project-workspace -p 'test_*.py' -v
      - name: Verify native workspace HTTP and persistence contracts when installed
        if: ${{ hashFiles('tests/atomic/packages/D06.json') != '' }}
        run: python3 tests/project-workspace/serve.py --require-clean-worktree --exit-after-http --output "$RUNNER_TEMP/workspace-http-evidence"
      - uses: actions/setup-go@v6
        with:
          go-version-file: tests/permissions/xlsx-go/go.mod
          cache: false
      - name: Test and build the independent bounded Go XLSX reader
        run: |
          go -C tests/permissions/xlsx-go test ./...
          go -C tests/permissions/xlsx-go vet ./...
          CGO_ENABLED=0 go -C tests/permissions/xlsx-go build -o "$RUNNER_TEMP/phorge-xlsx-reader" .
      - name: Prepare isolated optional XLSX and paired queue fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/permission-xlsx"
          cp tests/permissions/xlsx/composer.json tests/permissions/xlsx/composer.lock "$RUNNER_TEMP/permission-xlsx/"
          composer install --working-dir="$RUNNER_TEMP/permission-xlsx" --no-plugins --no-scripts --no-interaction --prefer-dist
          composer audit --working-dir="$RUNNER_TEMP/permission-xlsx" --locked --no-interaction
          docker create --name atomic-queue-binary gorge-taskqueue:atomic
          docker cp atomic-queue-binary:/usr/local/bin/gorge-taskqueue "$RUNNER_TEMP/gorge-taskqueue"
          docker rm atomic-queue-binary
          chmod +x "$RUNNER_TEMP/gorge-taskqueue"
          mkdir -p "$RUNNER_TEMP/governance-native-organization"
          python3 tests/atomic/extract_native_renderer.py --output "$RUNNER_TEMP/gorge-render" --provenance "$RUNNER_TEMP/governance-native-organization/render-binary-provenance.json" --revision "$GORGE_CONTRACT_REF"
      - name: Verify full native pipeline and shared read views in owned restored schemas
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/governance-completion"
          docker exec -e MYSQL_PWD="$GORGE_TEST_MYSQL_PASSWORD" "$MYSQL_CONTAINER" mysql --user=root --execute="SET GLOBAL log_bin_trust_function_creators = 1"
          docker create --name atomic-completion-file-binary gorge-file-storage:atomic
          docker cp atomic-completion-file-binary:/usr/local/bin/gorge-file-storage "$RUNNER_TEMP/gorge-file-storage"
          docker rm atomic-completion-file-binary
          chmod +x "$RUNNER_TEMP/gorge-file-storage"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-completion/native.json"
          cp "$RUNNER_TEMP/governance-batch-3/native-source.json" "$RUNNER_TEMP/governance-completion/native-source.json"
          cp "$RUNNER_TEMP/governance-batch-4/native-rule-branches.json" "$RUNNER_TEMP/governance-completion/native-rule-branches.json"
          cp "$RUNNER_TEMP/governance-batch-5/native-pipeline-composition.json" "$RUNNER_TEMP/governance-completion/native-pipeline-composition.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          PHORGE_GOVERNANCE_COMPLETION_QUEUE_PROFILE=gorge \
          PHORGE_GOVERNANCE_GORGE_FILE_BINARY="$RUNNER_TEMP/gorge-file-storage" \
          PHORGE_GOVERNANCE_GORGE_FILE_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-file-storage" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_TASKQUEUE_BINARY="$RUNNER_TEMP/gorge-taskqueue" \
          PHORGE_GOVERNANCE_GORGE_TASKQUEUE_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-taskqueue" | cut -d ' ' -f1)" \
          php support/governance/completion/fixture-run.php > "$RUNNER_TEMP/governance-completion/full-native.json"
          python3 scripts/governance/check_completion.py --receipt "$RUNNER_TEMP/governance-completion/full-native.json" > "$RUNNER_TEMP/governance-completion/completion.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-completion-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-completion
          if-no-files-found: error
      - name: Verify owned organization writes and durable approval consumption
        run: |
          mkdir -p "$RUNNER_TEMP/governance-organization"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-organization/native.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          php support/governance/organization/test-organization-mysql.php > "$RUNNER_TEMP/governance-organization/organization.json"
          python3 scripts/governance/check_organization.py --receipt "$RUNNER_TEMP/governance-organization/organization.json" > "$RUNNER_TEMP/governance-organization/accepted.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-organization-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-organization
          if-no-files-found: error
      - name: Verify the private media bootstrap state machine
        run: node tests/governance/js/test_private_media_bootstrap.cjs
      - name: Verify native directory identities, approvals and media backend
        run: |
          mkdir -p "$RUNNER_TEMP/governance-native-organization"
          cp "$RUNNER_TEMP/governance-batch-1/native.json" "$RUNNER_TEMP/governance-native-organization/native.json"
          python3 scripts/governance/check_native_directory.py > "$RUNNER_TEMP/governance-native-organization/callers.json"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          PHORGE_GOVERNANCE_GORGE_FILE_BINARY="$RUNNER_TEMP/gorge-file-storage" \
          PHORGE_GOVERNANCE_GORGE_FILE_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-file-storage" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_IMAGE_URI="$GORGE_TEST_IMAGE_URL" \
          PHORGE_GOVERNANCE_GORGE_IMAGE_TOKEN="$GORGE_TEST_IMAGE_TOKEN" \
          PHORGE_GOVERNANCE_GORGE_TASKQUEUE_BINARY="$RUNNER_TEMP/gorge-taskqueue" \
          PHORGE_GOVERNANCE_GORGE_TASKQUEUE_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-taskqueue" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_RENDER_BINARY="$RUNNER_TEMP/gorge-render" \
          PHORGE_GOVERNANCE_GORGE_RENDER_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-render" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_RENDER_SOURCE_REVISION="$GORGE_CONTRACT_REF" \
          PHORGE_GOVERNANCE_MEASUREMENT_SOURCE_REVISION="$GITHUB_SHA" \
          php support/governance/native-organization/test-native-organization-mysql.php > "$RUNNER_TEMP/governance-native-organization/integration.json"
          python3 scripts/governance/check_native_organization.py --receipt "$RUNNER_TEMP/governance-native-organization/integration.json" --file-binary "$RUNNER_TEMP/gorge-file-storage" --render-binary "$RUNNER_TEMP/gorge-render" --measurement-source-revision "$GITHUB_SHA" > "$RUNNER_TEMP/governance-native-organization/accepted.json"
          python3 scripts/governance/check_private_notifications.py --receipt "$RUNNER_TEMP/governance-native-organization/integration.json" --file-binary "$RUNNER_TEMP/gorge-file-storage" --render-binary "$RUNNER_TEMP/gorge-render" --measurement-source-revision "$GITHUB_SHA" > "$RUNNER_TEMP/governance-native-organization/private-email-sources.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-native-organization-php-${{ matrix.php }}
          path: ${{ runner.temp }}/governance-native-organization
          if-no-files-found: error
      - name: Verify fresh native API credential concurrency after native regression
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/governance-api-credential-concurrency"
          git rev-parse HEAD > "$RUNNER_TEMP/governance-api-credential-concurrency/source-revision.txt"
          sha256sum "$RUNNER_TEMP/gorge-file-storage" "$RUNNER_TEMP/gorge-taskqueue" "$RUNNER_TEMP/gorge-render" | sed "s|$RUNNER_TEMP/||g" > "$RUNNER_TEMP/governance-api-credential-concurrency/binary-sha256.txt"
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          PHORGE_GOVERNANCE_GORGE_FILE_BINARY="$RUNNER_TEMP/gorge-file-storage" \
          PHORGE_GOVERNANCE_GORGE_FILE_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-file-storage" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_IMAGE_URI="$GORGE_TEST_IMAGE_URL" \
          PHORGE_GOVERNANCE_GORGE_IMAGE_TOKEN="$GORGE_TEST_IMAGE_TOKEN" \
          PHORGE_GOVERNANCE_GORGE_TASKQUEUE_BINARY="$RUNNER_TEMP/gorge-taskqueue" \
          PHORGE_GOVERNANCE_GORGE_TASKQUEUE_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-taskqueue" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_RENDER_BINARY="$RUNNER_TEMP/gorge-render" \
          PHORGE_GOVERNANCE_GORGE_RENDER_SHA256="$(sha256sum "$RUNNER_TEMP/gorge-render" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_GORGE_RENDER_SOURCE_REVISION="$GORGE_CONTRACT_REF" \
          PHORGE_GOVERNANCE_MEASUREMENT_SOURCE_REVISION="$GITHUB_SHA" \
          php support/governance/native-organization/test-native-organization-mysql.php --api-credential-concurrency > "$RUNNER_TEMP/governance-api-credential-concurrency/integration.json"
