name: Focused native OAuth access-token ownership SQL

# Additional debugging signal; never a replacement for required Atomic CI.
on:
  workflow_call:
    inputs:
      expected_head:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact signed source commit for this manual full qualification
        required: true
        type: string

concurrency:
  group: oauth-access-producer-focused-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  oauth-access-owner:
    name: Focused OAuth access-token SQL8 (PHP 8.5.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: oauth-access-focused-disposable-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -poauth-access-focused-disposable-only" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      GORGE_TEST_MYSQL_PASSWORD: oauth-access-focused-disposable-only
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE_CHECKPOINT: ${{ github.event.pull_request.head.sha || github.sha }}
      PHORGE_TASK_TEST_CHECKPOINT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact full-tier caller checkpoint
        env:
          FOCUSED_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python3 -B scripts/ci/focused_workflows.py bind-head --expected-head "$FOCUSED_EXPECTED_HEAD"
      - name: Bind external event head and isolated PUBLIC verification home
        run: |
          umask 077
          trust_home="$RUNNER_TEMP/task-source-public-trust"
          python3 -B scripts/governance/check_task_ci_head_v1.py --prepare-public-trust \
            --public-key "$GITHUB_WORKSPACE/support/governance/source-operation/ci-source-verifier.asc" --trust-home "$trust_home"
          python3 -B scripts/governance/check_task_ci_head_v1.py --root "$GITHUB_WORKSPACE" \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --expected-head "$EXPECTED_SOURCE_CHECKPOINT" --github-sha "$GITHUB_SHA" --trust-home "$trust_home" --external-proof-tag "source-proof/$EXPECTED_SOURCE_CHECKPOINT"
          echo "PHORGE_CI_MERGE_SOURCE_PROOF=source-proof/$EXPECTED_SOURCE_CHECKPOINT" >> "$GITHUB_ENV"
          echo "HOME=$trust_home" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          ini-values: opcache.enable_cli=0, opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: mysqli, mbstring, curl, gd, zip, dom, xmlreader, xmlwriter
          tools: composer:2.11.1
          coverage: none
      - name: Own fresh focused output and require the reviewed pair
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_CHECKPOINT"
          php -r 'if (PHP_VERSION !== "8.5.12") { exit(1); }'
          mkdir "$RUNNER_TEMP/governance-oauth-access-focused" "$RUNNER_TEMP/oauth-access-focused-binary"
          git rev-parse HEAD > "$RUNNER_TEMP/governance-oauth-access-focused/source-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/governance-oauth-access-focused/source-tree.txt"
          python3 -B scripts/governance/check_directory_transports_task_source_v2.py --expected-checkpoint "$EXPECTED_SOURCE_CHECKPOINT" > "$RUNNER_TEMP/governance-oauth-access-focused/source-admission.json"
          revision=$(python3 tests/atomic/check_pair.py --print-revision)
          echo "GORGE_CONTRACT_REF=$revision" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          repository: soulteary/gorge
          ref: ${{ env.GORGE_CONTRACT_REF }}
          path: .test-gorge
          persist-credentials: false
      - name: Move the owned paired checkout outside the Phorge source tree
        run: |
          fixture_root=$(mktemp -d "$RUNNER_TEMP/oauth-access-gorge.XXXXXX")
          mv -- .test-gorge "$fixture_root/source"
          echo "ATOMIC_GORGE_SOURCE=$fixture_root/source" >> "$GITHUB_ENV"
      - name: Use the unchanged paired builder and retain its structured provenance
        run: |
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, runpy
          module = runpy.run_path('tests/atomic/build_gorge.py', run_name='focused_paired_builder')
          result = module['build'](pathlib.Path(os.environ['ATOMIC_GORGE_SOURCE']), os.environ['GORGE_CONTRACT_REF'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'governance-oauth-access-focused'
          pending = out / 'build-provenance.pending.json'
          with pending.open('x') as stream:
              json.dump(result, stream, sort_keys=True)
              stream.write('\n')
          pending.rename(out / 'build-provenance.json')
          PY
          sha256sum tests/atomic/check_pair.py tests/atomic/build_gorge.py tests/atomic/paired-gorge.json > "$RUNNER_TEMP/governance-oauth-access-focused/build-input-sha256.txt"
      - name: Extract only the actual paired File binary without starting a container
        run: |
          umask 077
          out="$RUNNER_TEMP/governance-oauth-access-focused"
          image_id=$(docker image inspect gorge-file-storage:atomic --format '{{.Id}}')
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "phorge.gorge-revision"}}')" = "$GORGE_CONTRACT_REF"
          docker image inspect "$image_id" --format '{"image_id":{{json .Id}},"paired_revision":{{json (index .Config.Labels "phorge.gorge-revision")}}}' > "$out/file-image-provenance.json"
          created=''
          cleanup_extract() {
            status=$?
            trap - EXIT
            if [ -n "$created" ]; then
              if docker rm "$created" > /dev/null; then
                printf '%s\n' '{"created_container_started":false,"exact_created_container_removed":true}' > "$out/extraction-cleanup.json"
              elif [ "$status" -eq 0 ]; then
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup_extract EXIT
          candidate=$(docker create --pull=never --name "oauth-access-file-extract-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$image_id")
          [[ "$candidate" =~ ^[a-f0-9]{64}$ ]] || exit 1
          created="$candidate"
          docker cp "$created:/usr/local/bin/gorge-file-storage" "$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage"
          chmod 0700 "$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage"
          sha256sum "$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage" | sed "s|$RUNNER_TEMP/oauth-access-focused-binary/||g" > "$out/binary-sha256.txt"
      - name: Build retained runtime and verify two deterministic standard map passes
        run: |
          umask 077
          php scripts/runtime/build.php all
          php bin/rebuild-library-map
          git diff --exit-code -- src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json
          sha256sum src/__phutil_library_map__.php support/runtime/src/__phutil_library_map__.php support/runtime/manifest.json > "$RUNNER_TEMP/governance-oauth-access-focused/verified-maps.sha256"
          php bin/rebuild-library-map
          sha256sum --check "$RUNNER_TEMP/governance-oauth-access-focused/verified-maps.sha256"
          php scripts/runtime/verify.php
      - name: Configure only the disposable MySQL fixture prerequisite
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD="$GORGE_TEST_MYSQL_PASSWORD" "$MYSQL_CONTAINER" mysql --user=root --execute="SET GLOBAL sql_mode = 'STRICT_ALL_TABLES'; SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Run only actual native OAuth access-token ownership SQL8 and strict source receipt
        id: oauth-access-owner
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          umask 077
          access_phase=source-preflight
          access_failure_stage() {
            access_status=$?
            trap - EXIT
            if [ "$access_status" -eq 0 ]; then exit 0; fi
            case "$access_phase" in source-preflight|probe-before|native-command|probe-after|receipt-check|result-publication) ;; *) access_phase=unknown ;; esac
            access_emit_stage() {
              printf '{"schema":"OAuthAccess-failure-stage-v3","role":"oauth-access","phase":"%s","actual_exit":%d,"passed":false,"runtime_authority":false,"SQL_qualified":false,"cleanup":"unknown"}\n' "$access_phase" "$access_status"
            }
            if access_emit_stage >&2; then :; fi
            if mkdir "$RUNNER_TEMP/oauth-access-stage-failure"; then
              if access_emit_stage > "$RUNNER_TEMP/oauth-access-stage-failure/diagnostic.pending.json"; then
                if mv "$RUNNER_TEMP/oauth-access-stage-failure/diagnostic.pending.json" "$RUNNER_TEMP/oauth-access-stage-failure/diagnostic.json"; then
                  if [ -n "${GITHUB_OUTPUT-}" ] && echo 'stage_owned=true' >> "$GITHUB_OUTPUT"; then :; fi
                fi
              fi
            fi
            exit "$access_status"
          }
          trap access_failure_stage EXIT
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_CHECKPOINT"
          sha256sum --check "$RUNNER_TEMP/governance-oauth-access-focused/verified-maps.sha256"
          mysql_image=$(docker inspect "$MYSQL_CONTAINER" --format '{{.Config.Image}}')
          test "$mysql_image" = 'mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7'
          access_phase=probe-before
          OAUTH_ACCESS_MYSQL_OBSERVED_IMAGE="$mysql_image" php scripts/governance/probe_oauth_access_task_mysql84.php before "$EXPECTED_SOURCE_CHECKPOINT" > "$RUNNER_TEMP/governance-oauth-access-focused/mysql-before.pending.json"
          mv "$RUNNER_TEMP/governance-oauth-access-focused/mysql-before.pending.json" "$RUNNER_TEMP/governance-oauth-access-focused/mysql-before.json"
          access_phase=native-command
          PHORGE_GOVERNANCE_ISOLATED_TEST=1 \
          PHORGE_GOVERNANCE_GORGE_FILE_BINARY="$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage" \
          PHORGE_GOVERNANCE_GORGE_FILE_SHA256="$(sha256sum "$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage" | cut -d ' ' -f1)" \
          PHORGE_GOVERNANCE_FIXTURE_DSN='mysql:host=127.0.0.1;port=3306;dbname=governance_fixture_bootstrap;charset=utf8mb4' \
          PHORGE_GOVERNANCE_FIXTURE_USER=root \
          PHORGE_GOVERNANCE_FIXTURE_PASSWORD="$GORGE_TEST_MYSQL_PASSWORD" \
          PHORGE_GOVERNANCE_MEASUREMENT_SOURCE_REVISION="$EXPECTED_SOURCE_CHECKPOINT" \
          python3 -B scripts/governance/run_task_directory_native_v2.py --root "$GITHUB_WORKSPACE" --expected-checkpoint "$EXPECTED_SOURCE_CHECKPOINT" --role oauth-access --directory "$RUNNER_TEMP/task-oauth-access-v2-private" --stdout "$RUNNER_TEMP/governance-oauth-access-focused/integration.json" --stderr "$RUNNER_TEMP/oauth-access-native.stderr.private" || {
            native_status=$?
            if mkdir "$RUNNER_TEMP/oauth-access-focused-failure"; then
              if python3 -B scripts/governance/project_oauth_access_failure.py --receipt "$RUNNER_TEMP/task-oauth-access-v2-private/capture-native-body.private.json" --stderr "$RUNNER_TEMP/oauth-access-native.stderr.private" > "$RUNNER_TEMP/oauth-access-focused-failure/diagnostic.pending.json"; then
                if mv "$RUNNER_TEMP/oauth-access-focused-failure/diagnostic.pending.json" "$RUNNER_TEMP/oauth-access-focused-failure/diagnostic.json"; then
                  if cat "$RUNNER_TEMP/oauth-access-focused-failure/diagnostic.json" >&2; then :; fi
                  if [ -n "${GITHUB_OUTPUT-}" ] && echo "diagnostic_owned=true" >> "${GITHUB_OUTPUT-}"; then :; fi
                fi
              fi
            fi
            exit "$native_status"
          }
          access_phase=probe-after
          mysql_image=$(docker inspect "$MYSQL_CONTAINER" --format '{{.Config.Image}}')
          test "$mysql_image" = 'mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7'
          OAUTH_ACCESS_MYSQL_OBSERVED_IMAGE="$mysql_image" php scripts/governance/probe_oauth_access_task_mysql84.php after "$EXPECTED_SOURCE_CHECKPOINT" > "$RUNNER_TEMP/governance-oauth-access-focused/mysql-after.pending.json"
          mv "$RUNNER_TEMP/governance-oauth-access-focused/mysql-after.pending.json" "$RUNNER_TEMP/governance-oauth-access-focused/mysql-after.json"
          access_phase=receipt-check
          python3 -B scripts/governance/check_oauth_access_task_schema_receipt_v2.py --root "$GITHUB_WORKSPACE" --expected-checkpoint "$EXPECTED_SOURCE_CHECKPOINT" --runtime-before "$RUNNER_TEMP/governance-oauth-access-focused/mysql-before.json" --runtime-after "$RUNNER_TEMP/governance-oauth-access-focused/mysql-after.json" --envelope "$RUNNER_TEMP/governance-oauth-access-focused/integration.json" --profile "$RUNNER_TEMP/task-oauth-access-v2-private/capture/schema-profile.private.json" --profile-sha "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_sha256"])' "$RUNNER_TEMP/task-oauth-access-v2-private/capture/binding.safe.json")" --file-binary "$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage" --file-sha "$(sha256sum "$RUNNER_TEMP/oauth-access-focused-binary/gorge-file-storage" | cut -d ' ' -f1)" > "$RUNNER_TEMP/governance-oauth-access-focused/accepted.pending.json"
          access_phase=result-publication
          mv "$RUNNER_TEMP/governance-oauth-access-focused/accepted.pending.json" "$RUNNER_TEMP/governance-oauth-access-focused/accepted.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: focused-oauth-access-owner-php-8.5.12
          path: ${{ runner.temp }}/governance-oauth-access-focused
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && steps.oauth-access-owner.outputs.diagnostic_owned == 'true'
        with:
          name: focused-oauth-access-failure-php-8.5.12
          path: ${{ runner.temp }}/oauth-access-focused-failure/diagnostic.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && steps.oauth-access-owner.outputs.stage_owned == 'true'
        with:
          name: focused-oauth-access-stage-failure-php-8.5.12
          path: ${{ runner.temp }}/oauth-access-stage-failure/diagnostic.json
          if-no-files-found: error
